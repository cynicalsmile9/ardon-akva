        const legacy = !!(u && u.hash);
        return `<tr>
          <td><b>${esc((u && (u.email || u.username)) || key)}</b>${me ? ` <span class="muted">— это вы</span>` : ""}${legacy ? ` <span class="muted">— старый аккаунт, вход отключён</span>` : ""}</td>
          <td>${legacy ? `<span class="muted">—</span>` : roleLabel(r)}</td>
          <td>${created}</td>
          <td><div class="row" style="gap:6px; justify-content:flex-end; flex-wrap:wrap;">
            ${me ? `<span class="muted">—</span>` : legacy ? `<button class="btn ghost small" data-user-del="${esc(key)}">Удалить</button>` : `
              ${r !== "user" ? `<button class="btn small" data-user-role="${key}:user">Открыть доступ</button>` : ""}
              ${r !== "pending" ? `<button class="btn ghost small" data-user-role="${key}:pending">Забрать доступ</button>` : ""}
              ${r !== "admin" ? `<button class="btn ghost small" data-user-role="${key}:admin">Сделать админом</button>` : ""}
              <button class="btn ghost small" data-user-del="${esc(key)}">Удалить</button>
            `}
          </div></td>
        </tr>`;
      }).join("")}
      </tbody></table>
    </div>
  </div></div>`;
}

function renderHelp(){
  return `
  ${topbar("Инструкция", "Как работает автоматизация")}
  <div class="panel"><div class="panel-body instr">
    <p>Раньше каждый день в Excel вручную протягивали формулы, переносили цифры между листами «Отход», «Кормление», «О2» и пересчитывали «Сводку» и «Инфографику». Здесь всё это делает программа сама.</p>
    <h3>Как вносить данные</h3>
    <p>1. Один раз занесите партии рыбы в разделе <b>«Зарыбление»</b> — дата, бассейн, навеска, количество.</p>
    <p>2. Когда рыбу переносят между бассейнами или продают — используйте раздел <b>«Пересадки»</b>: откуда, куда (или <b>«Продажа»</b>), сколько штук. Для продажи также укажите общий вес в килограммах. Проданная рыба выходит из учёта участка; её себестоимость списывается по доле проданного веса в биомассе перед продажей. Для старых записей без общего веса используются количество и указанная навеска, а при её отсутствии — последняя навеска бассейна. Погибшую рыбу вносите в «Отход» или «ЧП»: её затраты остаются на живой рыбе бассейна; при полном опустошении остаток затрат показывается отдельно.</p>
    <p>3. Каждый день заполняйте разделы <b>«Отход»</b>, <b>«Кормление»</b>, <b>«О2»</b> (по замерам в течение дня) и <b>«Температура»</b> — просто впишите цифры по бассейнам и нажмите «Сохранить». Повторное сохранение на ту же дату обновляет запись.</p>
    <p>4. Раздел <b>«Обработки»</b> — фиксируйте препараты и дозировки по бассейнам.</p>
    <p>5. Раздел <b>«ЧП»</b> — для происшествий, из-за которых погибла рыба (авария, отключение электричества, замор и т.п.), отдельно от обычного ежедневного отхода. Укажите дату, бассейн, сколько погибло и опишите, что случилось. Это число сразу прибавляется к обычному отходу и автоматически учитывается в остатке стада, на дашборде, в сводке и на графиках — вносить его повторно в «Отход» не нужно.</p>
    <p>6. Раздел <b>«Навески»</b> — периодически (например, раз в 1–2 недели) взвешивайте рыбу и вносите среднюю навеску (кг на одну рыбу) по каждому бассейну. По этим замерам программа сама считает <b>кормовой коэффициент</b> за выбранный период отдельно для каждого бассейна: берётся последний замер навески на начало и на конец периода, прирост биомассы = остаток стада × навеска на эти даты, а корм суммируется за дни между замерами. Кормовой коэффициент = корм за период (кг) ÷ прирост биомассы (кг).</p>
    <p>7. Раздел <b>«Корма и нормы»</b> — справочник кормов производителей: таблица норм кормления (% от массы рыбы в сутки по навескам и температуре), ожидаемый кормовой коэффициент и цены по датам. Новый корм добавляется вставкой таблицы из Excel; новая цена — одной строкой «с даты». Старые цены остаются: по ним пересчитывается себестоимость прошлых дней.</p>
    <p>8. В <b>«Кормлении»</b> в поле <b>«Расход корма (чистый), кг»</b> вносите сразу чистый расход. Возврат указывайте отдельно: он сохраняется в журнале и выгрузке, но не вычитается из расхода повторно. Например, при расходе 100 кг и возврате 10 кг в расчётах используются 100 кг. Под полями показывается норма на фактическое стадо (ожидаемая навеска × остаток × норма корма при температуре дня) и отклонение внесённого чистого расхода от неё. Корм по бассейну можно сменить в списке; если не трогать — берётся корм, положенный по навеске.</p>
    <p>9. <b>«Расчёт роста»</b> — план выращивания по бассейну или по всему участку : привес = навеска × норма корма ÷ кормовой коэффициент, отход — фактический процент хозяйства (или заданный вручную), температуры — по журналу «Температура». План фиксирует нормы и цены на момент создания; сравнение с фактом — по кормлению, взвешиваниям, численности, затратам и себестоимости 1 кг.</p>
    <p>10. <b>«Себестоимость»</b> — фактические затраты: малёк (стоимость партии при зарыблении), корм (внесённый чистый расход × цена выбранного корма на дату кормления), кислород и прочие затраты (внесённые вами суммы расходов). Возврат корма повторно не вычитается. Кислород не начисляется автоматически по корму: в блоке «Прочие затраты» выберите статью <b>«Кислород»</b>, дату, сумму и нужные бассейны. В итогах эта сумма учитывается один раз в колонке «Кислород».</p>
    <p>Для каждой записи расходов можно выбрать весь текущий участок, отдельные бассейны текущего участка или <b>«Бассейны разных участков»</b>. В последнем случае отметьте бассейны под названиями нужных участков: одна общая сумма распределяется между всеми отмеченными бассейнами, а каждый участок получает только свою долю. В журнале видны сумма всей записи и доля текущего участка. Удаление общей записи убирает её доли из всех выбранных участков.</p>
    <p>Сумма распределяется по биомассе выбранных бассейнов с рыбой на дату расхода. Если навески есть не у всех — по количеству рыб, с предупреждением. Пустые бассейны долю не получают. Каждая запись сохраняет свой набор бассейнов: новые расходы на Б1, Б2 и Б3 не меняют выбор бассейнов у прежних записей. При исправлении численности или навесок на дату расхода доли этой записи пересчитываются, в том числе между участками.</p>
    <p>Внутри дня расходы начисляются до пересадок. Навеска при пересадке — свежая навеска исходного бассейна: биомасса перед операцией = количество рыб перед операцией × эта навеска. Новое измерение заменяет предыдущую оценку веса исходного бассейна. Для занятого принимающего бассейна вводится его свежая навеска; масса до приёма = его количество × его свежая навеска. Сами измерения не меняют накопленную сумму затрат. При пересадке переносится доля всех накопленных затрат: <b>затраты исходного бассейна × взвешенная масса партии ÷ биомасса перед этой пересадкой</b>. Если за день весь бассейн пересажен несколькими взвешенными партиями, сумма их масс уточняет биомассу перед первой пересадкой, и затраты между партиями делятся по фактическим килограммам. При полной пересадке переносятся все затраты, исходный бассейн обнуляется, а количество партии уточняется по массе и навеске. Это уточнение не является отходом. В принимающем бассейне сумма прибавляется к его прежним затратам, численность — на массу партии ÷ её навеску, биомасса — на взвешенную массу партии. Средняя навеска после смешивания равна общей биомассе ÷ общей численности; итог по участку от пересадки не меняется. В старых пересадках без взвешенной массы используется количество × навеска партии (либо навеска исходного бассейна), масса отмечается как расчётная; если навески нет вообще — сохраняется перенос по численности с предупреждением. Навески и отход одного дня учитываются перед пересадками, а пересадки — по порядку добавления. Общие расходы уже входят в суммы бассейнов — повторно прибавлять их нельзя. При продаже себестоимость списывается по проданному весу. При отходе затраты остаются на выжившей рыбе; если бассейн полностью опустел, остаток затрат показывается в списаниях.</p>
    <p>Себестоимость 1 кг — накопленные затраты на оставшуюся рыбу, разделённые на её биомассу по последним навескам. Выберите <b>«Себестоимость на дату»</b>: таблица всех бассейнов и накопленные списания покажут состояние на конец этого дня. В <b>«Истории себестоимости»</b> выберите начало периода и отдельный бассейн либо все бассейны участка. При исправлении исходных записей история пересчитывается. Пустые бассейны остаются видны с нулевым остатком, а руб/кг для них не рассчитываются. Строка «Проверка общей суммы» связывает все начисленные затраты с остатком на рыбе, продажами, списаниями и нераспределёнными суммами.</p>
    <h3>Что считается автоматически</h3>
    <p>— Остаток стада по каждому бассейну (зарыбление плюс пересадки минус накопленный отход, включая отход по ЧП) — отдельным разделом <b>«Численность стада»</b> с историей по дням, по аналогии с «Отходом».<br>
    — Итоги по кормлению и отходу за день (журнал «Отход» + «ЧП» вместе).<br>
    — Среднесуточный О2 по каждому бассейну из всех замеров за день.<br>
    — Сводная таблица по всем журналам сразу.<br>
    — Графики на «Инфографике» — обновляются сразу после внесения новых данных.<br>
    — Тревоги на «Дашборде»: низкий О2, всплеск отхода, пропущенные записи за сегодня.<br>
    — Раздел <b>«Архив изменений»</b>: при исправлении или удалении любой записи прежнее значение не пропадает, а сохраняется там с меткой времени — можно посмотреть, что было раньше.</p>
    <h3>Данные</h3>
    <p>${dbAvailable ? "Все записи хранятся в общей базе этой программы — их видят все, у кого есть ссылка, и они сохраняются между посещениями." : "Сейчас база данных недоступна — введённые данные будут видны только в этой вкладке до перезагрузки страницы."}</p>
    <h3>Вход по имени пользователя и паролю</h3>
    <p>При открытии приложения нужно войти или зарегистрироваться — это несложная защита от случайных людей по ссылке, а не промышленный уровень безопасности: пароль хранится в виде хеша (не в открытом виде), но сама база данных доступна из кода страницы всем, у кого есть ссылка на приложение. Регистрация открыта для всех, у кого есть ссылка — отдельного приглашения не требуется. После входа сессия запоминается в этом браузере, пока не нажать «Выйти» в левом нижнем углу.</p>
    <h3>Установка как отдельного приложения</h3>
    <p>Страницу можно установить как приложение — с иконкой и отдельным окном, без адресной строки браузера:</p>
    <p><b>GrapheneOS / Android:</b> откройте ссылку в браузере (Vanadium/Chrome), откройте меню (⋮) и выберите «Установить приложение» или «Добавить на главный экран».<br>
    <b>MacBook (Safari или Chrome):</b> в Safari — меню «Файл» → «Добавить в Dock»; в Chrome — значок установки в адресной строке или меню → «Приложение…» → «Установить».<br>
    <b>Windows (Edge или Chrome):</b> значок установки в адресной строке (или меню → «Приложения» → «Установить это приложение»).</p>
    <p>Во всех случаях это один и тот же сайт — данные и вход одинаковые на всех устройствах, меняется только то, что он открывается как отдельная программа со своей иконкой, а не вкладка браузера.</p>
  </div></div>`;
}

/* ---------------------------------------------------------------------
   Wiring: form submits + delete/edit buttons for the active section
   ------------------------------------------------------------------- */
function wireActiveSection(){
  const main = document.getElementById("main");

  if(!currentUser){
    const loginForm = document.getElementById("loginForm");
    if(loginForm) loginForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(loginForm);
      const btn = loginForm.querySelector("button[type=submit]");
      if(btn) btn.disabled = true;
      try{
        const res = await handleLogin(f.get("email"), f.get("password"));
        if(!res.ok){ renderAuthScreen._err = res.msg; renderActive(); return; }
        renderAuthScreen._err = "";
        // дальше экран переключит onAuthStateChanged
      }catch(err){ console.error("login failed", err); renderAuthScreen._err = "Не удалось войти, попробуйте ещё раз"; renderActive(); }
      finally{ if(btn) btn.disabled = false; }
    });
    return;
  }

  if(!hasAccess()){
    const pendingBtn = document.getElementById("pendingLogoutBtn");
    if(pendingBtn) pendingBtn.addEventListener("click", logout);
    return;
  }

  const passwordForm = document.getElementById("passwordForm");
  if(passwordForm) passwordForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(passwordForm);
    const btn = passwordForm.querySelector("button[type=submit]");
    if(btn) btn.disabled = true;
    try{
      const res = await handlePasswordChange(f.get("current"), f.get("next"), f.get("next2"));
      renderPassword._err = res.ok ? "" : res.msg;
      renderPassword._done = res.ok ? "Пароль изменён. В следующий раз входите с новым паролем." : "";
    }catch(err){
      console.error("password change failed", err);
      renderPassword._err = "Не удалось сменить пароль, попробуйте ещё раз";
      renderPassword._done = "";
    }
    finally{ if(btn) btn.disabled = false; renderActive(); }
  });

  main.querySelectorAll("[data-export]").forEach(btn=>{
    btn.addEventListener("click", ()=> handleExport(btn.dataset.export));
  });

  main.querySelectorAll("[data-user-role]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!isAdmin()) return;
      const [key, role] = btn.dataset.userRole.split(":");
      if(!key || key === (currentUser && currentUser.key)) return;
      if(role === "admin" && !confirm("Сделать этот аккаунт администратором? Он сможет выдавать и забирать доступ у других.")) return;
      btn.disabled = true;
      try{
        await Store.setDoc("users", key, {...(state.users[key]||{}), role});
        toast(role === "pending" ? "Доступ закрыт" : (role === "admin" ? "Назначен администратором" : "Доступ открыт"));
      }catch(err){ console.error("role change failed", err); toast("Не удалось изменить доступ"); }
      finally{ btn.disabled = false; }
    });
  });

  main.querySelectorAll("[data-user-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!isAdmin()) return;
      const key = btn.dataset.userDel;
      if(!key || key === (currentUser && currentUser.key)) return;
      const u = state.users[key];
      if(!confirm(`Удалить аккаунт «${(u && u.username) || key}»? Человек сможет зарегистрироваться заново, но доступ снова будет закрыт.`)) return;
      try{ await Store.deleteDoc("users", key); toast("Аккаунт удалён"); }
      catch(err){ console.error("user delete failed", err); toast("Не удалось удалить аккаунт"); }
    });
  });

  main.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const [col,id] = btn.dataset.del.split(":");
      const shared = col==="sharedExpenses";
      if(!confirm(shared ? "Удалить общую запись расходов? Её доли будут убраны из всех выбранных участков." : "Удалить запись?")) return;
      const old = state[col] && state[col][id];
      await Store.deleteDoc(shared ? "expenses" : pcol(col), id);
      await archiveSnapshot(shared ? "expenses" : col, id, old, "delete");
      toast("Запись удалена");
    });
  });

  const archiveFilter = document.getElementById("archiveFilter");
  if(archiveFilter) archiveFilter.addEventListener("change", e=>{ renderArchive._section = e.target.value; renderActive(); });

  const stockingForm = document.getElementById("stockingForm");
  if(stockingForm) stockingForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(stockingForm);
    await Store.addDoc(pcol("stocking"), {
      date: f.get("date"), pool: f.get("pool"),
      weight: f.get("weight")? Number(f.get("weight")) : null,
      count: Number(f.get("count")), comment: f.get("comment")||"",
      price: f.get("price")? Number(f.get("price")) : null,
      cost: f.get("cost")? Number(f.get("cost")) : null
    });
    stockingForm.reset();
    toast("Зарыбление добавлено");
  });

  const transferForm = document.getElementById("transferForm");
  if(transferForm){
    transferForm.addEventListener('input',()=>updateTransferPreview(transferForm));
    transferForm.addEventListener('change',()=>updateTransferPreview(transferForm));
    updateTransferPreview(transferForm);
    transferForm.addEventListener('submit',async e=>{
      e.preventDefault();
      const t=transferFromForm(transferForm),error=transferValidation(t);
      if(error){toast(error);return;}
      const button=document.getElementById('transferSubmit');
      if(button.disabled)return;
      button.disabled=true;
      try {
        await Store.addDoc(pcol('transfers'),t);
        transferForm.reset();updateTransferPreview(transferForm);
        toast(t.to===OUT?'Продажа добавлена':'Пересадка добавлена');
      } catch(err){console.error('transfer save failed',err);toast('Не удалось сохранить запись. Проверьте соединение и повторите.');}
      finally {button.disabled=false;}
    });
  }

  const incidentForm = document.getElementById("incidentForm");
  if(incidentForm) incidentForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(incidentForm);
    await Store.addDoc(pcol("incidents"), {
      date: f.get("date"), pool: f.get("pool"), count: Number(f.get("count")),
      description: f.get("description")||"", comment: f.get("comment")||""
    });
    incidentForm.reset();
    toast("ЧП зафиксировано, отход пересчитан автоматически");
  });

  const mortForm = document.getElementById("mortForm");
  if(mortForm){
    document.getElementById("mortDate").addEventListener("change", e=>{ renderMortality._editDate = e.target.value; renderActive(); });
    mortForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(mortForm);
      const date = f.get("date");
      const values = {}; POOLS.forEach(p=> values[p] = num(f.get("p_"+p)));
      const old = state.mortality[date];
      await Store.setDoc(pcol("mortality"), date, {date, values});
      if(old) await archiveSnapshot("mortality", date, old, "edit");
      toast("Отход за "+fmtD(date)+" сохранён");
    });
    main.querySelectorAll("[data-edit-mort]").forEach(b=> b.addEventListener("click", ()=>{ renderMortality._editDate = b.dataset.editMort; renderActive(); }));
  }

  const feedForm = document.getElementById("feedForm");
  if(feedForm){
    document.getElementById("feedDate").addEventListener("change", e=>{ renderFeed._editDate = e.target.value; renderActive(); });
    feedForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(feedForm);
      const date = f.get("date");
      const used = {}, returned = {}, kinds = {};
      POOLS.forEach(p=>{
        used[p]=num(f.get("u_"+p)); returned[p]=num(f.get("r_"+p));
        // корм по бассейну: выбранный вручную, иначе — положенный по навеске на эту дату
        if(used[p] > 0){ const k = f.get("k_"+p) || econDefaultKind(p, date); if(k) kinds[p] = k; }
      });
      const old = state.feed[date];
      await Store.setDoc(pcol("feed"), date, {date, used, returned, kinds});
      if(old) await archiveSnapshot("feed", date, old, "edit");
      toast("Кормление за "+fmtD(date)+" сохранено");
    });
    main.querySelectorAll("[data-edit-feed]").forEach(b=> b.addEventListener("click", ()=>{ renderFeed._editDate = b.dataset.editFeed; renderActive(); }));
  }

  const naveskiForm = document.getElementById("naveskiForm");
  if(naveskiForm){
    document.getElementById("naveskiDate").addEventListener("change", e=>{ renderNaveski._editDate = e.target.value; renderActive(); });
    naveskiForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(naveskiForm);
      const date = f.get("date");
      const values = {};
      POOLS.forEach(p=>{ const v = f.get("p_"+p); if(v!==null && v!=="") values[p] = Number(v); });
      const old = state.naveski[date];
      await Store.setDoc(pcol("naveski"), date, {date, values});
      if(old) await archiveSnapshot("naveski", date, old, "edit");
      toast("Навески за "+fmtD(date)+" сохранены");
    });
    main.querySelectorAll("[data-edit-naveski]").forEach(b=> b.addEventListener("click", ()=>{ renderNaveski._editDate = b.dataset.editNaveski; renderActive(); }));
  }

  const fcrForm = document.getElementById("fcrForm");
  if(fcrForm) fcrForm.addEventListener("submit", e=>{
    e.preventDefault();
    const f = new FormData(fcrForm);
    const from = f.get("from")||"", to = f.get("to")||"";
    if(from && to && from > to){ toast("«С даты» позже «По дату» — проверьте диапазон"); return; }
    renderNaveski._fcrFrom = from;
    renderNaveski._fcrTo = to;
    renderActive();
  });

  const o2Form = document.getElementById("o2Form");
  if(o2Form){
    document.getElementById("o2Date").addEventListener("change", e=>{ renderO2._entryDate = e.target.value; renderActive(); });
    const viewSel = document.getElementById("o2ViewDate");
    if(viewSel) viewSel.addEventListener("change", e=>{ renderO2._viewDate = e.target.value; renderActive(); });
    o2Form.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(o2Form);
      const date = f.get("date"), time = f.get("time");
      const values = {};
      POOLS.forEach(p=>{
        if(f.get("nz_"+p)){ values[p]=NZ; return; }
        const v=f.get("p_"+p); if(v!==null && v!=="") values[p]=Number(v);
      });
      const existing = state.o2[date] || {date, entries:[]};
      const entries = [...(existing.entries||[]), {time, values}];
      await Store.setDoc(pcol("o2"), date, {date, entries});
      renderO2._viewDate = date;
      toast("Замер О2 добавлен");
    });
    main.querySelectorAll("[data-del-o2-entry]").forEach(b=> b.addEventListener("click", async ()=>{
      const [date, idxStr] = b.dataset.delO2Entry.split(":");
      const idx = Number(idxStr);
      const doc = state.o2[date];
      if(!doc) return;
      const entries = (doc.entries||[]).filter((_,i)=>i!==idx);
      await Store.setDoc(pcol("o2"), date, {date, entries});
      await archiveSnapshot("o2", date, doc, "edit");
      toast("Замер удалён");
    }));
  }

  const tempForm = document.getElementById("tempForm");
  if(tempForm){
    document.getElementById("tempDate").addEventListener("change", e=>{ renderTemp._entryDate = e.target.value; renderActive(); });
    const tempViewSel = document.getElementById("tempViewDate");
    if(tempViewSel) tempViewSel.addEventListener("change", e=>{ renderTemp._viewDate = e.target.value; renderActive(); });
    tempForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(tempForm);
      const date = f.get("date"), time = f.get("time");
      const values = {};
      POOLS.forEach(p=>{
        if(f.get("nz_"+p)){ values[p]=NZ; return; }
        const v=f.get("p_"+p); if(v!==null && v!=="") values[p]=Number(v);
      });
      const existing = state.temperature[date] || {date, entries:[]};
      const entries = [...(existing.entries||[]), {time, values}];
      await Store.setDoc(pcol("temperature"), date, {date, entries});
      renderTemp._viewDate = date;
      toast("Замер температуры добавлен");
    });
    main.querySelectorAll("[data-del-temp-entry]").forEach(b=> b.addEventListener("click", async ()=>{
      const [date, idxStr] = b.dataset.delTempEntry.split(":");
      const idx = Number(idxStr);
      const doc = state.temperature[date];
      if(!doc) return;
      const entries = (doc.entries||[]).filter((_,i)=>i!==idx);
      await Store.setDoc(pcol("temperature"), date, {date, entries});
      await archiveSnapshot("temperature", date, doc, "edit");
      toast("Замер удалён");
    }));
  }

  const nzInputs = {};
  main.querySelectorAll("[data-nz-input]").forEach(inp=>{ nzInputs[inp.dataset.nzInput] = inp; });
  main.querySelectorAll("[data-nz-check]").forEach(chk=>{
    const input = nzInputs[chk.dataset.nzCheck];
    const sync = ()=>{ if(!input) return; input.disabled = chk.checked; if(chk.checked) input.value = ""; };
    chk.addEventListener("change", sync);
    sync();
  });

  const treatForm = document.getElementById("treatForm");
  if(treatForm){
    treatForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(treatForm);
      const date = f.get("date");
      const existing = state.treatments[date] || {date, events:[]};
      const events = [...(existing.events||[]), {pool:f.get("pool"), text:f.get("text")}];
      await Store.setDoc(pcol("treatments"), date, {date, events});
      treatForm.reset();
      toast("Обработка добавлена");
    });
    main.querySelectorAll("[data-del-treat]").forEach(b=> b.addEventListener("click", async ()=>{
      const [date, idxStr] = b.dataset.delTreat.split(":");
      const idx = Number(idxStr);
      const doc = state.treatments[date];
      if(!doc) return;
      const events = (doc.events||[]).filter((_,i)=>i!==idx);
      await Store.setDoc(pcol("treatments"), date, {date, events});
      await archiveSnapshot("treatments", date, doc, "edit");
      toast("Обработка удалена");
    }));
  }

  const catalogForm = document.getElementById("catalogForm");
  if(catalogForm) catalogForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(catalogForm);
    await Store.addDoc("catalog", {
      from:Number(f.get("from")), to:Number(f.get("to")),
      size: f.get("size")?Number(f.get("size")):null,
      category: f.get("category")||"", feedType: f.get("feedType")
    });
    catalogForm.reset();
    toast("Строка добавлена в справочник");
  });

  const chartsRangeForm = document.getElementById("chartsRangeForm");
  if(chartsRangeForm){
    chartsRangeForm.addEventListener("submit", e=>{
      e.preventDefault();
      const f = new FormData(chartsRangeForm);
      const from = f.get("from")||"", to = f.get("to")||"";
      if(from && to && from > to){ toast("«С даты» позже «По дату» — проверьте диапазон"); return; }
      renderCharts._from = from;
      renderCharts._to = to;
      renderActive();
    });
    const resetBtn = document.getElementById("chartsRangeReset");
    if(resetBtn) resetBtn.addEventListener("click", ()=>{
      renderCharts._from = ""; renderCharts._to = "";
      renderActive();
    });
  }

  const chartsTypeSelect = document.getElementById("chartsTypeSelect");
  if(chartsTypeSelect){
    chartsTypeSelect.addEventListener("change", ()=>{
      renderCharts._chartType = chartsTypeSelect.value;
      renderActive();
    });
  }

  const gotoPlotsBtn = main.querySelector("[data-goto-plots]");
  if(gotoPlotsBtn) gotoPlotsBtn.addEventListener("click", ()=>{
    activeSection = "plots";
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.sec==="plots"));
    renderActive();
  });

  const plotForm = document.getElementById("plotForm");
  if(plotForm) plotForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(plotForm);
    const name = (f.get("name")||"").trim();
    if(!name){ toast("Введите название участка"); return; }
    const poolsRaw = (f.get("pools")||"").trim();
    const pools = poolsRaw ? poolsRaw.split(",").map(s=>s.trim()).filter(Boolean) : [];
    await Store.addDoc("plots", { name, pools, legacy:false, order: Object.keys(state.plots).length, createdAt: Date.now() });
    plotForm.reset();
    toast("Участок «"+name+"» создан");
  });

  main.querySelectorAll("[data-plot-switch]").forEach(b=> b.addEventListener("click", ()=> switchPlot(b.dataset.plotSwitch)));

  main.querySelectorAll("[data-plot-rename]").forEach(b=> b.addEventListener("click", async ()=>{
    const id = b.dataset.plotRename;
    const plot = state.plots[id]; if(!plot) return;
    const name = prompt("Новое название участка", plot.name||"");
    if(!name || !name.trim()) return;
    await Store.setDoc("plots", id, {...plot, name: name.trim()});
    toast("Участок переименован");
  }));

  main.querySelectorAll("[data-plot-del]").forEach(b=> b.addEventListener("click", async ()=>{
    const id = b.dataset.plotDel;
    if(id === LEGACY_PLOT_ID){ toast("Нельзя удалить основной участок"); return; }
    if(Object.keys(state.plots).length<=1){ toast("Должен остаться хотя бы один участок"); return; }
    if(!confirm("Убрать участок из списка? Уже внесённые в нём журналы не удаляются — они станут снова видны, если создать участок заново.")) return;
    await Store.deleteDoc("plots", id);
    toast("Участок убран из списка");
  }));

  main.querySelectorAll("[data-pool-add]").forEach(b=> b.addEventListener("click", async ()=>{
    const id = b.dataset.poolAdd;
    const input = main.querySelector(`[data-pool-input="${id}"]`);
    const val = input ? input.value.trim() : "";
    if(!val){ toast("Введите название бассейна"); return; }
    const plot = state.plots[id]; if(!plot) return;
    const pools = Array.isArray(plot.pools) ? [...plot.pools] : [];
    if(pools.includes(val)){ toast("Такой бассейн уже есть в этом участке"); return; }
    pools.push(val);
    await Store.setDoc("plots", id, {...plot, pools});
    if(input) input.value = "";
    toast("Бассейн добавлен");
  }));

  main.querySelectorAll("[data-pool-del]").forEach(b=> b.addEventListener("click", async ()=>{
    const [id, poolId] = b.dataset.poolDel.split("::");
    const plot = state.plots[id]; if(!plot) return;
    if(!confirm(`Убрать бассейн «${poolLabel(poolId)}» из участка «${plot.name}»? Ранее внесённые по нему данные не удаляются, но перестанут быть видны в формах, пока бассейн не будет добавлен обратно.`)) return;
    const pools = (Array.isArray(plot.pools) ? plot.pools : []).filter(p=>p!==poolId);
    await Store.setDoc("plots", id, {...plot, pools});
    toast("Бассейн убран из участка");
  }));

  wireEcon(main);
  if(activeSection === "charts") drawCharts();
}

/* =====================================================================
   ЭКОНОМИКА — ядро расчёта (без интерфейса)
   Справочник кормов с нормами производителя и ценами, модель роста
   (перенос листа «куркулятар» из «Расчет роста рыбы.xlsb»), нормы
   кормления на фактическое стадо, учёт фактической себестоимости.
   ===================================================================== */
// @@ECON_ENGINE_START
// Форелевые корма производителей с их сайтов (кнопка «Добавить корма производителей»):

function econRound(x){ return Math.sign(x) * Math.round(Math.abs(x)); } // округление 0,5 от нуля

/* ---------- корма ---------- */
function econSortFeeds(arr){

// Строка нормы корма для навески w (г): последняя строка с «от» ≤ w,

function econFeedRowFor(feed, wG){

  for(const f of feeds){

    if(!rows.length) continue;
    if(num(rows[0].wFrom) <= wG && wG < num(rows[rows.length-1].wTo)) return { feed:f, row: econFeedRowFor(f, wG) };
  }
  let best = null, bestTo = -Infinity, bestMin = null, minFrom = Infinity;
  feeds.forEach(f=>{

    const to = num(rows[rows.length-1].wTo), from = num(rows[0].wFrom);

function econRateAt(feed, row, T){

  (feed.temps||[]).forEach((t,i)=>{ const r = (row.rates||[])[i]; if(r !== null && r !== undefined && r !== "" && Number.isFinite(Number(r))) pairs.push([Number(t), Number(r)]); });
  if(!pairs.length) return 0;
  const temps = pairs.map(x=>x[0]), rates = pairs.map(x=>x[1]);
  const t = econRound(num(T, temps[0]));
  const exact = temps.indexOf(t);
  if(exact !== -1) return rates[exact];
  if(t <= temps[0]) return rates[0];
  if(t >= temps[temps.length-1]) return rates[temps.length-1];
  for(let i=1; i<temps.length; i++){
    if(t < temps[i]){
      const a = temps[i-1], b = temps[i];
      return rates[i-1] + (rates[i] - rates[i-1]) * (t - a)/(b - a);
    }

}
// Цена корма на дату: самая свежая запись прайса не позже даты — либо по этой
// фракции, либо общая на корм («все фракции»). При одной дате точная фракция главнее.
function econPriceAt(feed, fraction, dateISO){

  const list = ((feed && feed.prices) || []).filter(p=> p && p.date && p.date <= dateISO && (isAll(p) || Number(p.fraction) === Number(fraction)));
  list.sort((a,b)=> a.date.localeCompare(b.date) || (isAll(a) ? 0 : 1) - (isAll(b) ? 0 : 1));

/* ---------- модель роста (план) ----------

           temps[12], feeds[], o2Price, o2Coef[] }

function simulatePlan(plan){

  const temps = plan.temps || [];

  const rateK = num(plan.rateFactor, 1), mortDay = num(plan.mortPct, 0)/100, fcrPlan = num(plan.fcr, 0);
  const hold = num(plan.holdDays, 0), w0 = num(plan.weightG);
  const days = Math.max(1, Math.min(num(plan.days, 365), 1500));

    const date = isoAddDays(plan.startDate, i);
    const T = num(temps[Number(date.slice(5,7)) - 1], NaN);
    if(!Number.isFinite(T)) break; // нет температуры месяца — дальше не считаем
    const pick = econPickFeed(feeds, w);
    const isFast = fasting.includes(Number(date.slice(8,10)));
    const rate = (!pick || isFast) ? 0 : econRateAt(pick.feed, pick.row, T) * rateK;
    const fcr = pick && num(pick.row.fcr) > 0 ? num(pick.row.fcr) : fcrPlan;
    const biomass = w/1000*n;
    const feedKg = rate/100*biomass;
    const gain = fcr > 0 ? w*rate/100/fcr : 0;
    const price = pick ? econPriceAt(pick.feed, pick.row.fraction, date) : null;
    const feedCost = feedKg * (price ? num(price.price) : 0);
    const o2Cost = feedKg * econO2K(T, plan.o2Coef) * num(plan.o2Price);
    const other = num(plan.otherPerDay);
    cumFeed += feedKg; cumFeedCost += feedCost; cumO2 += o2Cost; cumOther += other;
    const totalCost = num(plan.startCost) + cumFeedCost + cumO2 + cumOther;
    const mort = mortDay * n;
    out.push({ i, date, T, w, n, biomass, rate, fcr, gain, feedKg, cumFeed,
      feedId: pick ? pick.feed.id : null, feedName: pick ? pick.feed.name : "", fraction: pick ? pick.row.fraction : "",
      price: price ? num(price.price) : null, feedCost, o2Cost, other, cumFeedCost, cumO2, cumOther, totalCost,
      costPerKg: biomass > 0 ? totalCost/biomass : null, mort });

let econVersion = 0;

// Средняя температура по месяцам — только из журнала «Температура» текущего
// участка. Месяц без замеров берёт значение ближайшего месяца, где замеры есть;
// если замеров нет совсем — температур нет (план попросит ввести их вручную).
function econMonthlyTemps(){
  return econCached("mtemps", ()=>{
    const sums = Array(12).fill(0), cnt = Array(12).fill(0);
    Object.values(state.temperature||{}).forEach(d=>{
      if(!d || !d.date) return;
      const m = tempDayMean(d);
      if(m === null || m === undefined || Number.isNaN(m)) return;
      const k = Number(d.date.slice(5,7)) - 1;
      sums[k] += m; cnt[k]++;
    });
    const have = []; for(let k=0; k<12; k++) if(cnt[k] > 0) have.push(k);
    const temps = [], fromJournal = [];
    for(let k=0; k<12; k++){
      if(cnt[k] > 0){ temps.push(sums[k]/cnt[k]); fromJournal.push(true); continue; }
      fromJournal.push(false);
      if(!have.length){ temps.push(null); continue; }
      let best = have[0], bd = 99;
      have.forEach(h=>{ const d = Math.min(Math.abs(h-k), 12-Math.abs(h-k)); if(d < bd){ bd = d; best = h; } });
      temps.push(sums[best]/cnt[best]);
    }
    return { temps, fromJournal, any: have.length > 0 };
  });
}
// Температура в бассейне на дату: замер за день → среднее по участку за день → среднемесячная.
function econTempFor(date, pool){

    const m = tempDayMean(doc);

function econFarmFCR(){

    const feed = rows.reduce((a,r)=>a+r.feed,0), gain = rows.reduce((a,r)=>a+r.gain,0);
    return gain > 0 && feed > 0 ? feed/gain : null;
  });
}
// Фактический отход хозяйства, % в сутки: погибшие (журнал + ЧП) ÷ остаток

function econFarmMortPct(pools){

    const P = econPopIndex();

    });

function econFcrFor(row){ return row && num(row.fcr) > 0 ? num(row.fcr) : econFarmFCR(); }

function econRawWeightIndex(data,pools){
    const idx = {};
    pools.forEach(p=> idx[p] = []);
    Object.values(data.naveski||{}).forEach(r=>{
      if(!r || !r.values) return;
      pools.forEach(p=>{ const v = r.values[p]; if(v !== undefined && v !== null && v !== "" && num(v) > 0) idx[p].push({ date:r.date, kg:num(v), src:"навеска" }); });
    });
    Object.values(data.stocking||{}).forEach(s=>{ if(idx[s.pool] && num(s.weight) > 0) idx[s.pool].push({ date:s.date, kg:num(s.weight), src:"зарыбление" }); });
    Object.values(data.transfers||{}).sort((a,b)=>num(a.createdAt)-num(b.createdAt)).forEach(t=>{
      if(idx[t.to] && num(t.weight)>0) idx[t.to].push({date:t.date,kg:num(t.weight),src:"пересадка"});
      if(t.to!==OUT && idx[t.from] && num(t.weight)>0) idx[t.from].push({date:t.date,kg:num(t.weight),src:"навеска перед пересадкой"});
    });
    const prio = { "навеска перед пересадкой":-1, "навеска":0, "зарыбление":1, "пересадка":2 };
    pools.forEach(p=> idx[p].sort((a,b)=> a.date.localeCompare(b.date) || prio[b.src]-prio[a.src]));

// Ожидаемая навеска на дату (г): от последнего замера дорастить по нормам

function econExpenseTargets(e){
  const seen = new Set();
  return (e.targets||[]).filter(t=>{
    if(!t || typeof t.plotId!=="string" || typeof t.pool!=="string") return false;
    const key = JSON.stringify([t.plotId,t.pool]);
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
}
function econExpensePlotOpening(plotId,date){
  const plot = (state.plots||{})[plotId];
  const context = (state.expensePlotData||{})[plotId];
  if(!plot || !Array.isArray(plot.pools)) return {error:"Участок не найден — проверьте распределение общей записи"};
  if(!context || !context.ready) return {error:context && context.failed ? "Не удалось загрузить данные участка «"+plot.name+"»" : "Загружаются данные участка «"+plot.name+"»"};
  const P = econCached("expense-pop|"+plotId,()=>buildPopulation(context.data,plot.pools));
  const W = econCached("expense-weight|"+plotId,()=>econBuildWeightIndex(context.data,plot.pools));
  return econTransferOpening(date,context.data,plot.pools,P,W);
}
function econExpensePools(e){
  if(Array.isArray(e.pools) && e.pools.length) return [...new Set(e.pools)].filter(p=>POOLS.includes(p));
  return e.pool ? (POOLS.includes(e.pool) ? [e.pool] : []) : POOLS.slice();
}
function econExpenseScopeLabel(e){
  if(e.targets && e.targets.length) return econExpenseTargets(e).map(econExpenseTargetLabel).join(", ");
  const pools = Array.isArray(e.pools) && e.pools.length ? [...new Set(e.pools)] : (e.pool ? [e.pool] : []);
  return pools.length ? pools.map(poolLabelRaw).join(", ") : "весь участок";
}
function econExpenseCategory(e){ return String(e.category||"").trim().toLowerCase()==="кислород" ? "o2" : "other"; }
function econExpenseAllocation(e, opening){
  if(e.targets && e.targets.length){
    const contexts = {}, entries = [];
    for(const t of econExpenseTargets(e)){
      if(!contexts[t.plotId]) contexts[t.plotId] = econExpensePlotOpening(t.plotId,e.date);
      const ctx = contexts[t.plotId];
      if(ctx.error) return {amounts:{},allAmounts:[],basis:"biomass",unallocated:0,pending:ctx.error};
      if(ctx.counts[t.pool]===undefined) return {amounts:{},allAmounts:[],basis:"biomass",unallocated:0,pending:"Бассейн удалён или переименован — проверьте распределение общей записи"};
      if(ctx.counts[t.pool]>0) entries.push({...t,n:ctx.counts[t.pool],kg:ctx.biomass[t.pool]});
    }
    const byBiomass = entries.every(t=>t.kg!==null && t.kg>0);
    const total = entries.reduce((s,t)=>s+(byBiomass ? t.kg : t.n),0);
    const allAmounts = entries.map(t=>({...t,amount:total>0 ? num(e.amount)*(byBiomass ? t.kg : t.n)/total : 0}));
    const amounts = Object.fromEntries(allAmounts.filter(t=>t.plotId===currentPlotId).map(t=>[t.pool,t.amount]));
    const owner = e.ownerPlotId || econExpenseTargets(e)[0]?.plotId;
    return {amounts,allAmounts,basis:byBiomass ? "biomass" : "count",unallocated:total>0 || owner!==currentPlotId ? 0 : num(e.amount),totalUnallocated:total>0 ? 0 : num(e.amount)};
  }
  const {counts,biomass} = opening || econTransferOpening(e.date);
  const pools = econExpensePools(e).filter(p=>counts[p]>0);
  const byBiomass = pools.every(p=>biomass[p]!==null && biomass[p]>0);
  const weights = pools.map(p=>byBiomass ? biomass[p] : counts[p]);
  const total = weights.reduce((s,w)=>s+w,0);
  const amounts = {};
  pools.forEach((p,i)=> amounts[p] = total>0 ? num(e.amount)*weights[i]/total : 0);
  return {amounts,basis:byBiomass ? "biomass" : "count",unallocated:total>0 ? 0 : num(e.amount)};
}
function econLedger(){
  return econCached("ledger", ()=>{
    const P = econPopIndex();
    const cats = ["fry","feed","o2","other"];
    const zero = ()=>({fry:0, feed:0, o2:0, other:0});
    const dateSet = new Set(P.dates);
    const expenses = econExpenseRecords().filter(e=> e && e.date);
    expenses.forEach(e=> dateSet.add(e.date));
    const dates = [...dateSet].sort();
    const stockByDate = {}, expByDate = {};
    Object.values(state.stocking||{}).forEach(s=>{ (stockByDate[s.date] = stockByDate[s.date] || []).push(s); });
    expenses.forEach(e=>{ (expByDate[e.date] = expByDate[e.date] || []).push(e); });
    const run = {}; POOLS.forEach(p=> run[p] = zero());
    const sold = zero(), lost = zero(), unallocated = zero();
    const soldByPool = {}, lostByPool = {};
    POOLS.forEach(p=>{ soldByPool[p] = 0; lostByPool[p] = 0; });
    const snap = {}, daily = {}, disposalSnap = {}, movements = [];
    const issues = { noPrice:{}, noFryPrice:[], autoKind:0, noWeight:{}, sales:[], expenses:[], transfers:[] };
    dates.forEach(date=>{
      const day = {}; POOLS.forEach(p=> day[p] = { feedKg:0, fry:0, feed:0, o2:0, other:0, kind:null, price:null, auto:false, soldKg:0, soldCost:0, lostCost:0 });
      (stockByDate[date]||[]).forEach(s=>{
        if(!run[s.pool]) return;
        let cost = 0;
        if(s.cost !== undefined && s.cost !== null && s.cost !== "") cost = num(s.cost);
        else if(num(s.price) > 0 && num(s.weight) > 0) cost = num(s.price) * num(s.weight) * num(s.count);
        else issues.noFryPrice.push(s);
        run[s.pool].fry += cost; day[s.pool].fry += cost;
      });
      const fd = state.feed && state.feed[date];
      if(fd){
        POOLS.forEach(p=>{
          // used уже содержит чистый расход; returned ведётся отдельно.
          const net = Math.max(0, num(fd.used && fd.used[p]));
          if(!(net > 0)) return;
          let kind = fd.kinds && fd.kinds[p];
          if(!kind){ kind = econDefaultKind(p, date); day[p].auto = true; issues.autoKind++; }
          const k = econParseKind(kind);
          const feed = k && state.feeds[k.feedId];
          const pr = feed ? econPriceAt(feed, k.fraction, date) : null;
          if(!pr){ const key = kind ? econKindLabel(kind) : "корм не определён (нет навески)"; issues.noPrice[key] = (issues.noPrice[key]||0) + net; }
          const feedCost = net * (pr ? num(pr.price) : 0);
          run[p].feed += feedCost;
          Object.assign(day[p], { feedKg:net, feed:feedCost, kind, price: pr ? num(pr.price) : null });
        });
      }
      const opening = econTransferOpening(date);
      const {transfers,counts,biomass,reconciled} = opening;
      (expByDate[date]||[]).forEach(e=>{
        const cat = econExpenseCategory(e);
        const allocation = econExpenseAllocation(e,opening);
        if(allocation.pending){ issues.expenses.push({date,text:`«${e.category}»: ${allocation.pending}. Распределение ещё не учтено в итогах`}); return; }
        Object.entries(allocation.amounts).forEach(([p,part])=>{ run[p][cat] += part; day[p][cat] += part; });
        unallocated[cat] += allocation.unallocated;
        if(allocation.unallocated) issues.expenses.push({date,text:`«${e.category}»: ${econExpenseScopeLabel(e)} — нет рыбы для распределения ${fmtN(e.amount,2)} руб`});
        else if(allocation.basis==="count") issues.expenses.push({date,text:`«${e.category}»: нет навески у части выбранных бассейнов — сумма распределена по количеству рыб`});
      });
      transfers.forEach(t=>{
        if(!run[t.from]) return;
        if(t.to !== OUT && !run[t.to]) return;
        prepareTransferMeasurements(t,counts,biomass,reconciled);
        const c = transferCount(t);
        const before = counts[t.from];
        const isSale = t.to === OUT;
        const full = !isSale && t.fullTransfer===true;
        const avg = before > 0 && biomass[t.from] !== null ? biomass[t.from]/before : 0;
        const batch = transferMass(t,avg);
        const movedKg = batch.kg;
        let share = 0;
        if(full || (before>0 && c>=before && (isSale || !(num(t.transferKg)>0)))) share=1;
        else if(movedKg!==null && biomass[t.from]>0) share=Math.min(1,movedKg/biomass[t.from]);
        else if(!isSale && !(num(t.transferKg)>0)) {
          share=before>0?Math.min(1,c/before):0;
          issues.transfers.push({date,pool:t.from,text:'В старой пересадке нет данных для массы — затраты перенесены по численности'});
        } else (isSale?issues.sales:issues.transfers).push({date,pool:t.from,text:'Нет биомассы исходного бассейна для переноса затрат. Внесите навеску'});
        if(!full && movedKg!==null && biomass[t.from]!==null && movedKg>biomass[t.from]+0.001) (isSale?issues.sales:issues.transfers).push({date,pool:t.from,text:'Масса партии больше расчётной биомассы — проверьте исходные данные'});
        if(isSale) day[t.from].soldKg += movedKg || 0;

        let movedCost = 0;
        cats.forEach(cat=>{
          const moved = run[t.from][cat] * share;
          movedCost += moved;
          run[t.from][cat] -= moved;
          if(run[t.to]) run[t.to][cat] += moved; else if(isSale) sold[cat] += moved;
        });
        applyHerdTransfer(t,counts,biomass,reconciled);

        if(isSale){ soldByPool[t.from] += movedCost; day[t.from].soldCost += movedCost; }
        movements.push({record:t,date,from:t.from,to:t.to,count:c,kg:movedKg,cost:movedCost,share,beforeKg:avg*before,estimated:batch.estimated,full,adjustment:full?c-before:0});
      });
      POOLS.forEach(p=>{
        const n = num(P.byDate[date] && P.byDate[date][p]);
        const tot = cats.reduce((s,c)=> s + run[p][c], 0);
        if(!(n > 0) && tot > 0 && P.byDate[date]){
          lostByPool[p] += tot; day[p].lostCost += tot;
          cats.forEach(c=>{ lost[c] += run[p][c]; run[p][c] = 0; });
        }
      });
      const sn = {}; POOLS.forEach(p=> sn[p] = {...run[p]});
      snap[date] = sn;
      daily[date] = day;
      disposalSnap[date] = { soldByPool:{...soldByPool}, lostByPool:{...lostByPool}, unallocated:{...unallocated} };
    });
    return { dates, snap, daily, sold, lost, unallocated, issues, disposalSnap, movements };
  });
}
function econCostAt(pool, date){
  const L = econLedger();
  let d = null;
  for(let i=L.dates.length-1; i>=0; i--){ if(L.dates[i] <= date){ d = L.dates[i]; break; } }
  const c = d ? L.snap[d][pool] : null;
  const z = { fry:0, feed:0, o2:0, other:0 };
  const res = c ? {...c} : z;
  res.total = res.fry + res.feed + res.o2 + res.other;
  return res;
}
function econDisposalsAt(pools, date){
  const L = econLedger();
  const d = L.dates.filter(d=>d<=date).pop();
  const snap = d && L.disposalSnap[d];
  return {
    sold: snap ? pools.reduce((s,p)=>s+num(snap.soldByPool[p]),0) : 0,
    lost: snap ? pools.reduce((s,p)=>s+num(snap.lostByPool[p]),0) : 0,
    unallocated: snap ? Object.values(snap.unallocated).reduce((s,x)=>s+num(x),0) : 0
  };
}
function econCostHistory(pools, from, to){
  const L = econLedger();
  if(!to || (from && from>to)) return [];
  const dates = new Set(L.dates.filter(d=>(!from || d>=from) && d<=to));
  if(from) dates.add(from);
  dates.add(to);
  return [...dates].sort().map(date=>{
    const st = econFactState(pools,date);
    const disposals = econDisposalsAt(pools,date);
    const day = L.daily[date] || {};
    return {date,...st,...disposals,
      soldKg:pools.reduce((s,p)=>s+num(day[p] && day[p].soldKg),0),
      soldCost:pools.reduce((s,p)=>s+num(day[p] && day[p].soldCost),0),
      lostCost:pools.reduce((s,p)=>s+num(day[p] && day[p].lostCost),0)};
  });
}
// Состояние бассейна/участка на дату по факту.
function econFactState(pools, date){
  let n = 0, biomass = 0, cost = 0, measured = true;
  const parts = { fry:0, feed:0, o2:0, other:0 };
  pools.forEach(p=>{
    const c = econCostAt(p, date);
    Object.keys(parts).forEach(k=> parts[k] += c[k]);
    cost += c.total;
    const np = econPopAt(p, date);
    if(!(np > 0)) return;
    n += np;
    const b = econBiomassAt(p,date);
    if(b!==null && b>0) biomass += b; else measured = false;
  });
  return { n, biomass, wG: n > 0 ? biomass/n*1000 : null, cost, parts, costPerKg: biomass > 0 ? cost/biomass : null, measured };
}
// Затраты, понесённые за период (не зависят от пересадок).
function econIncurred(pools, from, to){
  const L = econLedger();
  const res = { feedKg:0, fry:0, feed:0, o2:0, other:0 };
  L.dates.forEach(d=>{
    if((from && d < from) || (to && d > to)) return;
    pools.forEach(p=>{ const x = L.daily[d][p]; if(!x) return; Object.keys(res).forEach(k=> res[k] += num(x[k])); });
  });
  res.total = res.fry + res.feed + res.o2 + res.other;
  return res;
}

/* ---------- план против факта ---------- */
function econPlanPools(plan){ return plan.scope === "pool" ? (POOLS.includes(plan.pool) ? [plan.pool] : []) : POOLS.slice(); }
function econPlanFact(plan){
  return econCached("pf|"+plan.id+"|"+(plan.updatedAt||0), ()=>{
    const rows = simulatePlan(plan);
    const pools = econPlanPools(plan);
    const L = econLedger();
    const lastFact = L.dates.length ? L.dates[L.dates.length-1] : null;
    const facts = [];
    let cumFeed = 0, cumNorm = 0, cumCost = 0;
    rows.forEach(r=>{
      if(!lastFact || r.date > lastFact) return;
      const day = L.daily[r.date];
      let feedKg = 0, inc = 0, norm = 0, hasFeedDoc = !!(state.feed && state.feed[r.date]);
      pools.forEach(p=>{
        if(day && day[p]){ feedKg += day[p].feedKg; inc += day[p].feed + day[p].o2 + day[p].other; }
        const nm = econNorm(p, r.date, state.feed && state.feed[r.date] && state.feed[r.date].kinds && state.feed[r.date].kinds[p]);
        if(nm) norm += nm.kg;
      });
      cumFeed += feedKg; cumNorm += norm; cumCost += inc;
      const st = econFactState(pools, r.date);
      facts.push({ date:r.date, plan:r, feedKg, norm, cumFeed, cumNorm, incurred:cumCost, hasFeedDoc, ...st });
    });
    // взвешивания внутри периода плана
    const weighings = [];
    const navDates = Object.keys(state.naveski||{}).sort();
    navDates.forEach(d=>{
      const pr = rows.find(r=> r.date === d);
      if(!pr) return;
      const st = econFactState(pools, d);
      const anyMeasured = pools.some(p=>{ const v = state.naveski[d].values && state.naveski[d].values[p]; return v !== undefined && v !== null && v !== ""; });
      if(!anyMeasured || !(st.n > 0)) return;
      weighings.push({ date:d, planW:pr.w, factW:st.wG, planN:pr.n, factN:st.n, planB:pr.biomass, factB:st.biomass });
    });
    return { rows, facts, weighings, pools, lastFact };
  });
}
function econPct(fact, plan){ return plan ? (fact - plan)/plan*100 : null; }
function econDevTag(pct, mode){
  // mode: "abs" — плохо в обе стороны; "lower" — меньше лучше; "higher" — больше лучше
  if(pct === null || pct === undefined || !Number.isFinite(pct)) return `<span class="tag muted">н/д</span>`;
  const a = Math.abs(pct);
  let cls;
  if((mode === "lower" && pct <= 0) || (mode === "higher" && pct >= 0)) cls = "good";
  else cls = a < 5 ? "good" : (a < 15 ? "warn" : "bad");
  return `<span class="tag ${cls}">${pct > 0 ? "+" : ""}${fmtN(pct,1)}%</span>`;
}

/* ---------- интерфейс: «Корма и нормы» ---------- */
function econFmtInput(x){ return (x === undefined || x === null || x === "") ? "" : String(x).replace(".", ","); }
function econNormsToText(feed){
  const temps = feed.temps || [];
  const head = ["от, г","до, г","фракция, мм","КК"].concat(temps.map(t=>t)).join("\t");
  const lines = econFeedRows(feed).map(r=> [r.wFrom, r.wTo, r.fraction, (r.fcr===null||r.fcr===undefined)?"-":r.fcr].concat((r.rates||[]).map(x=> x===null||x===undefined ? "-" : x)).map(econFmtInput).join("\t"));
  return [head].concat(lines).join("\n");
}
// Таблица норм: первая строка — заголовок, где после четырёх колонок
// (от, до, фракция, КК) идут температуры; дальше строки с цифрами.
// Разделитель — табуляция (вставка из Excel) или «;». Нормы — в % от массы рыбы в сутки.
function econParseNorms(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length < 2) throw new Error("Нужна строка заголовка с температурами и хотя бы одна строка норм");
  const split = l => (l.indexOf("\t") !== -1 ? l.split("\t") : l.split(";")).map(c=>c.trim());
  const head = split(lines[0]);
  const temps = head.slice(4).map(parseNum);
  if(!temps.length || temps.some(t=> !Number.isFinite(t))) throw new Error("В заголовке после «от; до; фракция; КК» должны идти температуры числами, например 2; 4; 6 …");
  for(let i=1; i<temps.length; i++) if(temps[i] <= temps[i-1]) throw new Error("Температуры в заголовке должны идти по возрастанию");
  const rows = lines.slice(1).map((l, i)=>{
    const c = split(l).map(parseNum);
    const [wFrom, wTo, fraction, fcr] = c;
    // пустая ячейка или «-» — норма не задана (кормить по поедаемости)
    const rates = temps.map((_,k)=>{ const v = c[4+k]; return Number.isFinite(v) ? v : null; });
    if([wFrom, wTo, fraction].some(v=> !Number.isFinite(v))) throw new Error(`Строка ${i+2}: «от», «до» и «фракция» должны быть числами`);
    if(!(wTo > wFrom)) throw new Error(`Строка ${i+2}: «до» должно быть больше «от»`);
    if(Number.isFinite(fcr) && !(fcr > 0)) throw new Error(`Строка ${i+2}: КК должен быть больше нуля (или оставьте ячейку пустой)`);
    if(c.length > 4 + temps.length) throw new Error(`Строка ${i+2}: норм больше, чем температур в заголовке`);
    if(!rates.some(v=> v !== null)) throw new Error(`Строка ${i+2}: нет ни одной нормы`);
    if(rates.some(v=> v !== null && v < 0)) throw new Error(`Строка ${i+2}: норма не может быть отрицательной`);
    if(rates.some(v=> v !== null && v > 20)) throw new Error(`Строка ${i+2}: норма больше 20% в сутки — проверьте, что нормы указаны в процентах`);
    return { wFrom, wTo, fraction, fcr: Number.isFinite(fcr) ? fcr : null, rates };
  }).sort((a,b)=> a.wFrom - b.wFrom);
  return { temps, rows };
}
function econParseDate(s){
  s = String(s||"").trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m) return s;
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return null;
}
function econPricesToText(feed){
  return ((feed.prices)||[]).slice().sort((a,b)=> a.date.localeCompare(b.date) || num(a.fraction)-num(b.fraction))
    .map(p=> [fmtDRaw(p.date), (p.fraction === "" || p.fraction === null || p.fraction === undefined) ? "все" : econFmtInput(p.fraction), econFmtInput(p.price)].join("\t")).join("\n");
}
function econParsePrices(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  return lines.map((l, i)=>{
    const c = (l.indexOf("\t") !== -1 ? l.split("\t") : l.split(";")).map(x=>x.trim());
    const date = econParseDate(c[0]);
    if(!date) throw new Error(`Цены, строка ${i+1}: дата должна быть в виде ДД.ММ.ГГГГ`);
    const frRaw = (c[1]||"").toLowerCase();
    const fraction = (frRaw === "" || frRaw === "все" || frRaw === "*") ? "" : parseNum(frRaw);
    if(fraction !== "" && !Number.isFinite(fraction)) throw new Error(`Цены, строка ${i+1}: фракция — число или «все»`);
    const price = parseNum(c[2]);
    if(!(price >= 0)) throw new Error(`Цены, строка ${i+1}: цена должна быть числом`);
    return { date, fraction, price };
  });
}
function econCurrentPrices(feed){
  const today = todayISO();
  const fracs = [...new Set(econFeedRows(feed).map(r=> Number(r.fraction)))];
  return fracs.map(fr=>({ fraction:fr, price: econPriceAt(feed, fr, today) }));
}

function econSpecsLine(f){
  const sp = f.specs || {};
  const parts = [];
  if(sp.type) parts.push(esc(sp.type));
  if(sp.protein !== undefined && sp.protein !== "") parts.push("протеин "+esc(sp.protein)+"%");
  if(sp.fat !== undefined && sp.fat !== "") parts.push("жир "+esc(sp.fat)+"%");
  if(sp.astaxanthin) parts.push("астаксантин: "+esc(sp.astaxanthin));
  if(sp.fractions) parts.push("гранулы "+esc(sp.fractions)+" мм");
  return parts.join(" · ");
}
function econFeedRange(f){
  const rows = econFeedRows(f);
  if(!rows.length) return "нет норм";
  const a = num(rows[0].wFrom), b = num(rows[rows.length-1].wTo);
  return `${a<=0 ? "до" : fmtN(a, a<1?2:0)+"–"}${a<=0?" ":""}${fmtN(b, b<1?2:0)} г`;
}
function renderFeedCompare(feeds){
  if(feeds.length < 2) return "";
  const sortKey = renderFeeds._sort || "type";
  const val = (f, k)=>{ const sp = f.specs||{}; if(k==="w") return num((econFeedRows(f)[0]||{}).wFrom); if(k==="protein"||k==="fat") return parseFloat(String(sp[k]||"").replace(",", ".")) || 0; return String(k==="name"?f.name:(sp[k]||"")); };
  const list = feeds.slice().sort((a,b)=>{ const x = val(a,sortKey), y = val(b,sortKey); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y),"ru")) || val(a,"w") - val(b,"w"); });
  const th = (k, t)=> `<th style="cursor:pointer;${k==="name"||k==="type"?"text-align:left;":""}" data-feed-sort="${k}">${t}${sortKey===k?" ▾":""}</th>`;

      ${list.map(f=>{ const sp = f.specs||{}; const cur = econCurrentPrices(f).filter(c=>c.price); return `<tr>

        <td style="text-align:left; white-space:normal;">${esc(sp.astaxanthin||"—")}</td><td class="num">${esc(sp.fractions||[...new Set(econFeedRows(f).map(r=>fmtN(r.fraction,1)))].join("; "))}</td>
        <td class="num">${econFeedRange(f)}</td>
        <td class="num">${cur.length ? fmtN(Math.min(...cur.map(c=>c.price.price)),0)+(cur.length>1?"–"+fmtN(Math.max(...cur.map(c=>c.price.price)),0):"")+" руб/кг" : '<span class="hint">нет цены</span>'}</td>
        <td>${f.active===false?'<span class="tag muted">выкл.</span>':'<span class="tag good">в работе</span>'}</td></tr>`; }).join("")}

/* ---------- интерфейс: «Расчёт роста» (план и отклонения) ---------- */
function econPlanList(){ return Object.entries(state.plans||{}).map(([id,p])=>({...p, id})).sort((a,b)=> (b.startDate||"").localeCompare(a.startDate||"") || num(b.createdAt)-num(a.createdAt)); }
function econScopeLabel(plan){ return plan.scope === "pool" ? poolLabel(plan.pool) : "весь участок"; }
// Стартовые значения плана по факту на дату.
function econPlanAuto(scope, pool, date){
  const pools = scope === "pool" ? [pool] : POOLS;
  let n = 0, wsum = 0, cost = 0;
  pools.forEach(p=>{
    cost += econCostAt(p, date).total;
    const np = econPopAt(p, date);
    if(!(np > 0)) return;
    const pw = econProjectedWeight(p, date);
    n += np; if(pw) wsum += np * pw.g;
  });
  return { count: Math.round(n), weightG: n > 0 && wsum > 0 ? wsum/n : null, startCost: cost };
}
const PLAN_TARGETS = [1,5,10,50,100,200,300,400,500,700,1000,1250,1500,2000,2500,3000];

  const plans = econPlanList();

    <div class="panel-body">
      ${noFeeds ? `<div class="alert warn" style="margin-bottom:12px;">Сначала заполните раздел «Корма и нормы» — без норм план не считается.</div>` : ""}

          <div class="field"><label>Дней без роста в начале</label><input type="number" name="holdDays" step="1" min="0" value="0"></div>
          <div class="field"><label>Разгрузочные дни месяца</label><input type="text" name="fasting" value="${esc(S.fastingDays.join(", "))}"></div>
        </div>
        <div class="field"><label>Средняя температура воды по месяцам, °C (янв … дек, через «;»)</label>
          <input type="text" name="temps" value="${esc(MT.temps.map(t=> t===null ? "" : String(Math.round(t*10)/10).replace(".",",")).join("; "))}" placeholder="заполните, если журнал температуры пуст">
          <div class="hint">${MT.any ? `Посчитано по журналу «Температура» этого участка.${MT.fromJournal.every(Boolean) ? "" : " Месяцы без замеров (" + MT.fromJournal.map((x,k)=> x ? null : ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"][k]).filter(Boolean).join(", ") + ") взяты по ближайшему месяцу с замерами — поправьте при необходимости."}` : "В журнале «Температура» нет замеров — впишите 12 значений вручную."}</div></div>

        <td><button class="btn ghost small" data-plan-open="${esc(p.id)}">открыть</button> <button class="btn ghost small" data-plan-refresh="${esc(p.id)}" title="Взять текущие нормы, цены и температуры">обновить нормы и цены</button> <button class="btn danger" data-plan-del="${esc(p.id)}">удалить</button></td></tr>`).join("")}
    </tbody></table></div>
  </div>` : "";

  return `${topbar("Расчёт роста", "План выращивания по нормам кормов и отклонения фактических показателей от него", sel ? exportButton("plan","Выгрузить план в Excel") : "")}
  ${sel ? renderPlanView(state.plans[sel] && {...state.plans[sel], id:sel}) : ""}

function renderPlanView(plan){
  if(!plan) return "";
  const pf = econPlanFact(plan);
  const rows = pf.rows;
  if(!rows.length) return `<div class="panel"><div class="panel-body"><div class="alert warn">План «${esc(plan.name)}» пустой — проверьте численность и навеску.</div></div></div>`;
  const last = pf.facts.length ? pf.facts[pf.facts.length-1] : null;
  const end = rows[rows.length-1];
  const ms = planMilestones(rows, PLAN_TARGETS);
  const noPrice = rows.filter(r=> r.feedKg > 0 && r.price === null).length;
  let cards = "";
  if(last){
    const p = last.plan;
    const planInc = p.cumFeedCost + p.cumO2 + p.cumOther;
    cards = `
    <div class="grid cards">
      <div class="card"><div class="label">Навеска на ${fmtD(last.date)}</div><div class="value">${last.wG!==null?fmtN(last.wG,1):"—"}<small> г факт</small></div><div class="delta">план ${fmtN(p.w,1)} г · ${econDevTag(econPct(last.wG, p.w), "higher")}</div></div>

      <div class="card"><div class="label">Корм с начала плана</div><div class="value">${fmtN(last.cumFeed,0)}<small> кг</small></div><div class="delta">план ${fmtN(p.cumFeed,0)} · ${econDevTag(econPct(last.cumFeed, p.cumFeed), "abs")}</div></div>

  const recent = pf.facts.slice(-21).reverse();
  const feedTable = pf.facts.length ? `
  <div class="panel">
    <div class="panel-head"><h2>Кормление по дням: план, норма на фактическое стадо, факт</h2><span class="hint">последние ${recent.length} дн.</span></div>

      <div class="hint" style="margin-bottom:8px;">«Норма» — сколько положено скормить фактической рыбе: ожидаемая навеска (от последнего взвешивания по нормам) × остаток × норма выбранного корма при температуре дня. Отклонение от нормы показывает, сколько перекормили/недокормили, отклонение от плана — насколько день отличается от расчётного.</div>
      <table><thead><tr><th>Дата</th><th>План, кг</th><th>Норма, кг</th><th>Факт, кг</th><th>Факт к норме</th><th>Факт к плану</th><th>Навеска план, г</th><th>Остаток план / факт</th></tr></thead><tbody>
      ${recent.map(f=>`<tr><td>${fmtD(f.date)}</td><td class="num">${fmtN(f.plan.feedKg,1)}</td><td class="num">${fmtN(f.norm,1)}</td><td class="num">${f.hasFeedDoc?fmtN(f.feedKg,1):'<span class="hint">не внесено</span>'}</td>
        <td>${!f.hasFeedDoc ? "" : (f.norm === 0 && f.feedKg > 0 ? '<span class="tag warn">разгрузочный день</span>' : econDevTag(econPct(f.feedKg, f.norm), "abs"))}</td><td>${!f.hasFeedDoc ? "" : (f.plan.feedKg === 0 && f.feedKg > 0 ? '<span class="tag warn">по плану без корма</span>' : econDevTag(econPct(f.feedKg, f.plan.feedKg), "abs"))}</td>
        <td class="num">${fmtN(f.plan.w,1)}</td><td class="num">${fmtN(f.plan.n)} / ${fmtN(f.n)}</td></tr>`).join("")}
      </tbody></table>
    </div>
  </div>` : `<div class="panel"><div class="panel-body hint">Фактических данных за период плана пока нет — отклонения появятся после первых записей кормления, отхода и навесок.</div></div>`;

  const weighTable = pf.weighings.length ? `
  <div class="panel">
    <div class="panel-head"><h2>Рост: взвешивания против плана</h2></div>
    <div class="panel-body table-wrap"><table><thead><tr><th>Дата</th><th>Навеска план, г</th><th>Навеска факт, г</th><th>Откл.</th><th>Остаток план</th><th>Остаток факт</th><th>Биомасса план, кг</th><th>Биомасса факт, кг</th><th>Откл.</th></tr></thead><tbody>
      ${pf.weighings.slice().reverse().map(w=>`<tr><td>${fmtD(w.date)}</td><td class="num">${fmtN(w.planW,1)}</td><td class="num">${fmtN(w.factW,1)}</td><td>${econDevTag(econPct(w.factW,w.planW),"higher")}</td><td class="num">${fmtN(w.planN)}</td><td class="num">${fmtN(w.factN)}</td><td class="num">${fmtN(w.planB,0)}</td><td class="num">${fmtN(w.factB,0)}</td><td>${econDevTag(econPct(w.factB,w.planB),"higher")}</td></tr>`).join("")}
    </tbody></table></div>
  </div>` : "";

  return `
  <div class="panel" style="border-color:var(--accent);">
    <div class="panel-head"><h2>${esc(plan.name||"План")} · ${econScopeLabel(plan)}</h2>
      <span class="hint">старт ${fmtD(plan.startDate)} · ${fmtN(plan.count)} шт. по ${fmtN(plan.weightG,2)} г · стоимость стада ${fmtN(plan.startCost,0)} руб · норма ${fmtN(num(plan.rateFactor,1)*100)}% · отход ${fmtN(num(plan.mortPct),3)}%/сут · КК ${num(plan.fcr)>0?fmtN(plan.fcr,2):"из норм корма"} · нормы и цены от ${fmtD(new Date(num(plan.updatedAt||plan.createdAt)).toISOString().slice(0,10))}</span></div>
    <div class="panel-body">
      ${noPrice ? `<div class="alert warn" style="margin-bottom:12px;">В ${noPrice} дн. плана у корма нет цены — затраты на корм в эти дни равны нулю. Добавьте цены в «Корма и нормы» и нажмите «обновить нормы и цены».</div>` : ""}
      ${cards || `<div class="hint">Отклонения появятся, когда по ${econScopeLabel(plan)} начнут вноситься данные после ${fmtD(plan.startDate)}.</div>`}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;">
        <div><label>Навеска, г: план и взвешивания</label><div class="chart-box"><canvas id="planChartW"></canvas></div></div>
        <div><label>Корм нарастающим итогом, кг</label><div class="chart-box"><canvas id="planChartF"></canvas></div></div>
        <div><label>Себестоимость 1 кг, руб</label><div class="chart-box"><canvas id="planChartC"></canvas></div></div>
      </div>
      <div class="hint" id="planChartsNote"></div>
    </div>
  </div>
  ${feedTable}
  ${weighTable}
  <div class="panel">
    <div class="panel-head"><h2>Прогноз по навескам</h2><span class="hint">к концу плана (${fmtD(end.date)}): ${fmtN(end.w,0)} г, ${fmtN(end.n)} шт., ${fmtN(end.biomass,0)} кг, ${fmtN(end.costPerKg,1)} руб/кг</span></div>
    <div class="panel-body table-wrap"><table><thead><tr><th>Навеска, г</th><th>Дата</th><th>Суток</th><th>Остаток, шт.</th><th>Биомасса, кг</th><th>Корм с начала, кг</th><th>Стоимость стада, руб</th><th>Себестоимость, руб/кг</th></tr></thead><tbody>
      ${ms.filter(m=> m.target > num(plan.weightG)).map(m=> m.reached ? `<tr><td>${fmtN(m.target)}</td><td>${fmtD(m.row.date)}</td><td class="num">${fmtN(m.days)}</td><td class="num">${fmtN(m.row.n)}</td><td class="num">${fmtN(m.row.biomass,0)}</td><td class="num">${fmtN(m.row.cumFeed,0)}</td><td class="num">${fmtN(m.row.totalCost,0)}</td><td class="num">${fmtN(m.row.costPerKg,1)}</td></tr>` : `<tr><td>${fmtN(m.target)}</td><td colspan="7" class="hint">не достигается за срок плана</td></tr>`).join("")}
    </tbody></table></div>
  </div>`;
}

function drawPlanCharts(retries){
  retries = retries || 0;
  const plan = renderPlan._sel && state.plans[renderPlan._sel] ? {...state.plans[renderPlan._sel], id:renderPlan._sel} : null;
  if(!plan || !document.getElementById("planChartW")) return;
  if(typeof Chart === "undefined"){ if(retries < 20) setTimeout(()=>drawPlanCharts(retries+1), 250); return; }
  destroyCharts();
  const pf = econPlanFact(plan);
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue("--accent").trim() || "#0E7C86";
  const warn = styles.getPropertyValue("--warn").trim() || "#B4711F";
  const inkDim = styles.getPropertyValue("--ink-dim").trim() || "#53696C";
  Chart.defaults.color = inkDim;
  Chart.defaults.borderColor = styles.getPropertyValue("--border").trim() || "#D6E5E2";
  const factBy = {}; pf.facts.forEach(f=> factBy[f.date] = f);
  const labels = pf.rows.map(r=> fmtDRaw(r.date));
  const weighBy = {}; pf.weighings.forEach(w=> weighBy[w.date] = w.factW);
  const opts = (fmt)=>({ responsive:true, maintainAspectRatio:false, interaction:{mode:"index", intersect:false},
    plugins:{ legend:{position:"bottom", labels:{boxWidth:9, boxHeight:9, font:{size:11}}} },
    scales:{ x:{ ticks:{ maxTicksLimit:8 } }, y:{ ticks:{ callback:v=>fmtN(v, fmt) } } } });
  const planDs = (data, label)=>({ label, data, borderColor:accent, backgroundColor:accent, borderWidth:2, pointRadius:0, tension:.2 });
  const factDs = (data, label, points)=>({ label, data, borderColor:warn, backgroundColor:warn, borderWidth:2, pointRadius: points?4:0, showLine: !points, spanGaps:true, tension:.2 });
  charts.planW = new Chart(document.getElementById("planChartW"), { type:"line",
    data:{ labels, datasets:[ planDs(pf.rows.map(r=>r.w), "план"), factDs(pf.rows.map(r=> weighBy[r.date] !== undefined ? weighBy[r.date] : null), "взвешивание", true) ] }, options: opts(0) });
  charts.planF = new Chart(document.getElementById("planChartF"), { type:"line",
    data:{ labels, datasets:[ planDs(pf.rows.map(r=>r.cumFeed), "план"), factDs(pf.rows.map(r=> factBy[r.date] ? factBy[r.date].cumFeed : null), "факт") ] }, options: opts(0) });
  charts.planC = new Chart(document.getElementById("planChartC"), { type:"line",
    data:{ labels, datasets:[ planDs(pf.rows.map(r=>r.costPerKg), "план"), factDs(pf.rows.map(r=> factBy[r.date] && factBy[r.date].costPerKg ? factBy[r.date].costPerKg : null), "факт") ] }, options: opts(0) });
  const note = document.getElementById("planChartsNote");
  if(note) note.textContent = "Фактическая себестоимость 1 кг считается по последней внесённой навеске, поэтому меняется скачком в дни взвешиваний.";
}

/* ---------- интерфейс: «Себестоимость» (факт) ---------- */
function expenseFromForm(form){
  const f = new FormData(form);
  const pools = f.get("scope")==="selected" ? [...new Set(f.getAll("pools"))].filter(p=>POOLS.includes(p)) : [];
  const doc = {date:f.get("date"), category:String(f.get("category")||"").trim(),
    pool:pools.length===1 ? pools[0] : "", pools, amount:Number(f.get("amount")), comment:f.get("comment")||""};
  if(f.get("scope")==="cross"){
    doc.targets = econExpenseTargets({targets:f.getAll("targets").map(value=>{ try{const [plotId,pool]=JSON.parse(value);return {plotId,pool};}catch(err){return null;} })});
    doc.ownerPlotId = currentPlotId;
  }
  return doc;
}
function updateExpensePreview(){
  const form = document.getElementById("expenseForm");
  if(!form) return;
  const selected = form.elements.scope.value==="selected";
  const cross = form.elements.scope.value==="cross";
  document.getElementById("expensePools").hidden = !selected;
  document.getElementById("expenseCrossPools").hidden = !cross;
  form.querySelectorAll('[name="pools"]').forEach(el=> el.disabled = !selected);
  form.querySelectorAll('[name="targets"]').forEach(el=> el.disabled = !cross);
  const preview = document.getElementById("expensePreview");
  const e = expenseFromForm(form);
  if(selected && !e.pools.length){ preview.textContent = "Выберите хотя бы один бассейн."; return; }
  if(cross && !e.targets.length){ preview.textContent = "Отметьте нужные бассейны под названиями участков."; return; }
  if(!e.date || !(e.amount>0)){ preview.textContent = "Укажите дату и сумму — здесь появится распределение по бассейнам."; return; }
  const a = econExpenseAllocation(e);
  if(a.pending){ preview.textContent = a.pending+". Сохранение станет доступно после загрузки данных."; return; }
  if(a.unallocated || a.totalUnallocated){ preview.textContent = "На эту дату в выбранных бассейнах нет рыбы. Проверьте дату и выбор бассейнов."; return; }
  preview.textContent = "Распределение " + (a.basis==="biomass" ? "по биомассе" : "по количеству рыб (не хватает навесок)") + ": " +
    (a.allAmounts ? a.allAmounts.map(t=>econExpenseTargetLabel(t)+" — "+fmtN(t.amount,2)+" руб") : Object.entries(a.amounts).map(([p,amount])=>poolLabelRaw(p)+" — "+fmtN(amount,2)+" руб")).join(" · ");
}
function costHistorySelection(at){
  const from = renderCost._historyFrom && renderCost._historyFrom <= at ? renderCost._historyFrom : at.slice(0,8)+"01";
  const pool = POOLS.includes(renderCost._historyPool) ? renderCost._historyPool : "";
  return {from,pool,pools:pool ? [pool] : POOLS.slice()};
}

      </tbody></table></div>
    </div></div>`;

function renderCost(){
  const L = econLedger();
  const lastDate = L.dates.length ? L.dates[L.dates.length-1] : todayISO();
  const at = renderCost._at || lastDate;
  const from = renderCost._from || (at.slice(0,8) + "01");
  const to = renderCost._to || at;
  const disposals = econDisposalsAt(POOLS,at);
  const rows = POOLS.map(p=>{
    const c = econCostAt(p, at);
    const n = econPopAt(p, at);
    const lw = econLastWeight(p, at);
    const biomass = econBiomassAt(p,at);
    return { p, c, n, lw, biomass, perKg: biomass > 0 ? c.total/biomass : null };
  });
  const tot = rows.reduce((s,r)=>({ fry:s.fry+r.c.fry, feed:s.feed+r.c.feed, o2:s.o2+r.c.o2, other:s.other+r.c.other, total:s.total+r.c.total, n:s.n+r.n, biomass:s.biomass+r.biomass }), {fry:0,feed:0,o2:0,other:0,total:0,n:0,biomass:0});
  const inc = econIncurred(POOLS, from, to);
  const accrued = econIncurred(POOLS,"",at).total + disposals.unallocated;
  const incByPool = POOLS.map(p=>({ p, ...econIncurred([p], from, to) }));
  const plans = econPlanList();
  const planDev = plans.map(pl=>{
    const pf = econPlanFact(pl);
    let f = null;
    for(const x of pf.facts){ if(x.date <= at) f = x; }
    return { pl, f };
  }).filter(x=> x.f);
  const issues = L.issues;
  const noPriceKeys = Object.keys(issues.noPrice);
  const alerts = [];
  if(!econAllFeeds().length) alerts.push(`<div class="alert warn">Справочник «Корма и нормы» пуст — корм в себестоимости считается по нулевой цене.</div>`);
  noPriceKeys.forEach(k=> alerts.push(`<div class="alert warn">Нет цены для «${esc(k)}» на дату кормления — ${fmtN(issues.noPrice[k],1)} кг корма учтены по нулевой цене. Добавьте цену в «Корма и нормы» с более ранней датой.</div>`));
  if(issues.noFryPrice.length) alerts.push(`<div class="alert warn">У ${issues.noFryPrice.length} записей зарыбления не указана цена малька — их стоимость не учтена. Укажите цену в разделе «Зарыбление».</div>`);
  if(issues.autoKind) alerts.push(`<div class="alert good">В ${fmtN(issues.autoKind)} записях кормления (бассейн × день) корм не выбран вручную — взят корм по навеске из справочника.</div>`);
  issues.transfers.concat(econPopIndex().warnings||[]).filter(x=>x.date<=at).forEach(x=>alerts.push(`<div class="alert warn">${fmtD(x.date)}, ${poolLabel(x.pool)}: ${esc(x.text)}.</div>`));
  issues.sales.filter(x=>x.date<=at).forEach(x=>alerts.push(`<div class="alert warn">${fmtD(x.date)}, ${poolLabel(x.pool)}: ${esc(x.text)}.</div>`));
  issues.expenses.filter(x=>x.date<=at).forEach(x=>alerts.push(`<div class="alert warn">${fmtD(x.date)}: ${esc(x.text)}.</div>`));
  const expenses = econExpenseRecords().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  return `
  ${topbar("Себестоимость", "Фактические затраты на стадо по журналам: малёк, корм, кислород, прочие затраты", exportButton("cost","Выгрузить в Excel"))}
  <div class="panel"><div class="panel-body">
    <form id="costAtForm" class="row" style="align-items:flex-end;">
      <div class="field" style="max-width:200px;"><label>Себестоимость на дату</label><input type="date" name="at" value="${esc(at)}"></div>
      <button class="btn" type="submit">Показать</button>
    </form>
  </div></div>
  ${alerts.length ? `<div class="alert-list" style="margin-bottom:16px;">${alerts.join("")}</div>` : ""}
  <div class="grid cards">
    <div class="card"><div class="label">Стоимость стада</div><div class="value">${fmtN(tot.total,0)}<small> руб</small></div><div class="delta">на ${fmtD(at)}</div></div>
    <div class="card"><div class="label">Биомасса</div><div class="value">${fmtN(tot.biomass,0)}<small> кг</small></div><div class="delta">${fmtN(tot.n)} шт. · навески и масса пересадок</div></div>
    <div class="card"><div class="label">Себестоимость 1 кг</div><div class="value">${tot.biomass>0?fmtN(tot.total/tot.biomass,1):"—"}<small> руб</small></div><div class="delta">в среднем по участку</div></div>
    <div class="card"><div class="label">Затраты за период</div><div class="value">${fmtN(inc.total,0)}<small> руб</small></div><div class="delta">${fmtD(from)} – ${fmtD(to)}</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Себестоимость по бассейнам на ${fmtD(at)}</h2><span class="hint">затраты переходят вместе с рыбой при пересадках</span></div>
    <div class="panel-body table-wrap"><table><thead><tr><th>Бассейн</th><th>Остаток, шт.</th><th>Навеска, кг</th><th>Биомасса, кг</th><th>Малёк</th><th>Корм</th><th>Кислород</th><th>Прочие</th><th>Итого, руб</th><th>Руб/кг</th></tr></thead><tbody>
