/* ---------- блок норм в «Кормлении» ---------- */
function renderFeedNormBlock(date, existing){
  const opts = econKindOptions(true);
  const shown = POOLS;
  const rows = shown.map(p=>{
    const saved = existing && existing.kinds && existing.kinds[p];
    const def = econDefaultKind(p, date);
    const kind = saved || def;
    const nm = econNorm(p, date, kind);
    const known = new Set(opts.map(o=>o.value));
    const extra = kind && !known.has(kind) ? [{ value:kind, label: econKindLabel(kind) }] : [];
    return `<tr data-norm-row="${esc(p)}" data-norm-kg="${nm ? nm.kg : ""}">
      <td>${poolLabel(p)}${econPopAt(p,date)>0?'':' <span class="hint">нет рыбы</span>'}</td>
      <td style="text-align:left;"><select name="k_${esc(p)}" data-kind-pool="${esc(p)}" style="min-width:210px;">
        <option value="">${def ? "по навеске: "+esc(econKindLabel(def)) : "— не выбран —"}</option>
        ${extra.concat(opts).map(o=>`<option value="${esc(o.value)}" ${saved===o.value?"selected":""}>${esc(o.label)}</option>`).join("")}
      </select></td>
      <td class="num">${nm ? fmtN(nm.wG, nm.wG<10?2:0)+` <span class="hint" title="последний замер ${fmtDRaw(nm.pw.measuredDate)}: ${fmtN(nm.pw.measuredKg*1000, 1)} г (${nm.pw.src})">${nm.pw.days?"расч.":"замер"}</span>` : "—"}</td>
      <td class="num">${fmtN(econPopAt(p,date))}</td>
      <td class="num">${nm ? fmtN(nm.T,1)+"°" : "—"}</td>
      <td class="num" data-norm-cell="${esc(p)}">${nm ? (nm.fasting ? '0 <span class="hint">разгр.</span>' : fmtN(nm.kg,1)) : "—"}</td>
      <td class="num" data-fact-cell="${esc(p)}">—</td>
      <td data-dev-cell="${esc(p)}"></td>
    </tr>`;
  }).join("");
  return `${!opts.length?'<div class="alert warn" style="margin-bottom:12px;">Чтобы видеть норму и отклонения, заполните раздел «Корма и нормы».</div>':''}<label style="margin-top:4px;">Корм и норма по бассейнам на ${fmtD(date)}</label>
    <div class="table-wrap" style="margin-bottom:12px;"><table><thead><tr><th>Бассейн</th><th style="text-align:left;">Корм · фракция</th><th>Навеска, г</th><th>Остаток, шт.</th><th>t воды</th><th>Норма, кг</th><th>Чистый факт, кг</th><th>Откл. от нормы</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="font-weight:600;"><td>Итого</td><td></td><td></td><td></td><td></td><td class="num" id="normTotal">—</td><td class="num" id="factTotal">—</td><td id="devTotal"></td></tr></tfoot></table></div>`;
}
function updateFeedNormLive(){
  const form = document.getElementById("feedForm");
  if(!form) return;
  const date = form.querySelector("[name=date]").value;
  let nT = 0, fT = 0, any = false;
  POOLS.forEach(p=>{
    const row = form.querySelector(`[data-norm-row="${CSS.escape(p)}"]`);
    if(!row) return;
    const sel = row.querySelector("select");
    const nm = econNorm(p, date, sel && sel.value ? sel.value : null);
    const used = num((form.querySelector(`[name="u_${CSS.escape(p)}"]`)||{}).value);
    const fact = Math.max(0, used);
    const nCell = row.querySelector("[data-norm-cell]"), fCell = row.querySelector("[data-fact-cell]"), dCell = row.querySelector("[data-dev-cell]");
    if(nCell) nCell.innerHTML = nm ? (nm.fasting ? '0 <span class="hint">разгр.</span>' : fmtN(nm.kg,1)) : "—";
    if(fCell) fCell.textContent = fmtN(fact,1);
    if(dCell) dCell.innerHTML = nm && nm.kg > 0 ? econDevTag(econPct(fact, nm.kg), "abs") + ` <span class="hint">${fact-nm.kg>=0?"+":""}${fmtN(fact-nm.kg,1)} кг</span>` : (fact > 0 && nm && nm.fasting ? `<span class="tag warn">кормили в разгрузочный день</span>` : "");
    if(nm){ nT += nm.kg; any = true; }
    fT += fact;
  });
  const nt = document.getElementById("normTotal"), ft = document.getElementById("factTotal"), dt = document.getElementById("devTotal");
  if(nt) nt.textContent = any ? fmtN(nT,1) : "—";
  if(ft) ft.textContent = fmtN(fT,1);
  if(dt) dt.innerHTML = any && nT > 0 ? econDevTag(econPct(fT, nT), "abs") : "";
}
// Норма и факт за день по всему участку — для истории кормления и дашборда.
function econDayNormFact(date){
  const doc = state.feed && state.feed[date];
  let norm = 0, fact = 0, any = false;
  POOLS.forEach(p=>{
    const nm = econNorm(p, date, doc && doc.kinds && doc.kinds[p]);
    if(nm){ norm += nm.kg; any = true; }
    if(doc) fact += Math.max(0, num(doc.used && doc.used[p]));
  });
  return { norm: any ? norm : null, fact };
}

/* ---------- обработчики ---------- */
async function econSeedFeeds(){
  const now = Date.now();
  const have = new Set(Object.values(state.feeds||{}).map(f=>String(f.name||"").trim().toLowerCase()));
  for(const f of ECON_CATALOG){
    if(have.has(f.name.toLowerCase())) continue;
    await Store.addDoc("feeds", { ...JSON.parse(JSON.stringify(f)), updatedAt: now });
  }
}
function econSnapshotFeeds(){ return JSON.parse(JSON.stringify(econActiveFeeds())); }
function econParseDays(s){ return String(s||"").split(/[,;\s]+/).map(x=>parseInt(x,10)).filter(x=> x>=1 && x<=31); }

function wireEcon(main){
  // --- корма и нормы
  main.querySelectorAll("[data-feed-new]").forEach(b=> b.addEventListener("click", ()=>{ renderFeeds._edit = "new"; renderFeeds._err = ""; renderActive(); }));
  main.querySelectorAll("[data-feed-edit]").forEach(b=> b.addEventListener("click", ()=>{ renderFeeds._edit = b.dataset.feedEdit; renderFeeds._err = ""; renderActive(); const el = document.getElementById("feedEditorPanel"); if(el) el.scrollIntoView({behavior:"smooth"}); }));
  main.querySelectorAll("[data-feed-cancel]").forEach(b=> b.addEventListener("click", ()=>{ renderFeeds._edit = null; renderFeeds._err = ""; renderActive(); }));
  main.querySelectorAll("[data-feed-seed]").forEach(b=> b.addEventListener("click", async ()=>{
    b.disabled = true;
    try{ await econSeedFeeds(); toast("Корма производителей добавлены выключенными — включите нужные и укажите цены"); }
    catch(err){ console.error(err); toast("Не удалось сохранить корма — проверьте правила доступа базы"); b.disabled = false; }
  }));
  main.querySelectorAll("[data-feed-sort]").forEach(th=> th.addEventListener("click", ()=>{ renderFeeds._sort = th.dataset.feedSort; renderActive(); }));
  main.querySelectorAll("[data-feed-catalog]").forEach(b=> b.addEventListener("click", async ()=>{
    b.disabled = true;
    try{ await econSeedFeeds(); toast("Корма производителей добавлены выключенными — включите нужные и укажите цены"); }
    catch(err){ console.error(err); toast("Не удалось сохранить корма — проверьте правила доступа базы"); b.disabled = false; }
  }));
  main.querySelectorAll("[data-feed-toggle]").forEach(b=> b.addEventListener("click", async ()=>{
    const id = b.dataset.feedToggle, f = state.feeds[id]; if(!f) return;
    await Store.setDoc("feeds", id, {...f, active: f.active === false, updatedAt: Date.now()});
    await archiveSnapshot("feeds", id, f, "edit");
    toast(f.active === false ? "Корм возвращён в работу" : "Корм убран из работы");
  }));
  main.querySelectorAll("[data-feed-del]").forEach(b=> b.addEventListener("click", async ()=>{
    const id = b.dataset.feedDel, f = state.feeds[id]; if(!f) return;
    if(!confirm(`Удалить корм «${f.name}»? Записи кормления с этим кормом потеряют цену. Обычно лучше «Убрать из работы».`)) return;
    await Store.deleteDoc("feeds", id);
    await archiveSnapshot("feeds", id, f, "delete");
    toast("Корм удалён");
  }));
  const feedEditForm = document.getElementById("feedEditForm");
  if(feedEditForm) feedEditForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(feedEditForm);
    try{
      const name = String(f.get("name")||"").trim();
      if(!name) throw new Error("Укажите название корма");
      const { temps, rows } = econParseNorms(f.get("norms"));
      const prices = econParsePrices(f.get("prices"));
      const id = renderFeeds._edit !== "new" ? renderFeeds._edit : uid();
      const old = state.feeds[id];
      await Store.setDoc("feeds", id, { name, manufacturer: String(f.get("manufacturer")||"").trim(), order: num(f.get("order")), active: f.get("active") !== "0", temps, rows, prices, source: (old && old.source) || "",
        specs: { ...((old && old.specs) || {}), type: String(f.get("sp_type")||"").trim(), protein: String(f.get("sp_protein")||"").trim(), fat: String(f.get("sp_fat")||"").trim(), astaxanthin: String(f.get("sp_astaxanthin")||"").trim(), fractions: String(f.get("sp_fractions")||"").trim() },
        updatedAt: Date.now() });
      if(old) await archiveSnapshot("feeds", id, old, "edit");
      renderFeeds._edit = null; renderFeeds._err = "";
      toast(`Корм «${name}» сохранён`);
    }catch(err){
      renderFeeds._err = err.message || String(err);
      renderActive();
    }
  });
  main.querySelectorAll(".feedPriceForm").forEach(form=> form.addEventListener("submit", async e=>{
    e.preventDefault();
    const id = form.dataset.feedId, feed = state.feeds[id]; if(!feed) return;
    const f = new FormData(form);
    const fr = f.get("fraction");
    const entry = { date: f.get("date"), fraction: fr === "" ? "" : Number(fr), price: Number(f.get("price")) };
    const prices = (feed.prices||[]).filter(p=> !(p.date === entry.date && String(p.fraction) === String(entry.fraction)));
    prices.push(entry);
    await Store.setDoc("feeds", id, {...feed, prices, updatedAt: Date.now()});
    await archiveSnapshot("feeds", id, feed, "edit");
    toast(`Цена ${fmtN(entry.price,2)} руб/кг с ${fmtDRaw(entry.date)} добавлена`);
  }));
  const econSettingsForm = document.getElementById("econSettingsForm");
  if(econSettingsForm) econSettingsForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(econSettingsForm);
    const doc = { ...(state.settings.economy||{}),
      o2Price: num(f.get("o2Price")),
      fastingDays: econParseDays(f.get("fasting")),
      o2Coef: (()=>{
        // пары «до t — кг О2 на кг корма»; пустые поля пропускаются
        const list = [];
        [["t1","k1"],["t2","k2"]].forEach(([t,k])=>{ const tv = parseNum(f.get(t)), kv = parseNum(f.get(k)); if(Number.isFinite(tv) && Number.isFinite(kv)) list.push({maxT:tv, k:kv}); });
        const k3 = parseNum(f.get("k3")); if(Number.isFinite(k3)) list.push({maxT:null, k:k3});
        return list;
      })(),
      updatedAt: Date.now() };
    await Store.setDoc("settings", "economy", doc);
    toast("Настройки расчёта сохранены");
  });

  // --- расчёт роста
  const planForm = document.getElementById("planForm");
  if(planForm){
    const scopeEl = document.getElementById("planScope"), startEl = document.getElementById("planStart");
    const fillAuto = ()=>{
      const sv = scopeEl.value;
      const scope = sv === "plot" ? "plot" : "pool", pool = sv === "plot" ? null : sv.slice(5);
      const a = econPlanAuto(scope, pool, startEl.value || todayISO());
      document.getElementById("planCount").placeholder = a.count ? "авто: "+fmtN(a.count) : "нет рыбы на дату";
      document.getElementById("planWeight").placeholder = a.weightG ? "авто: "+fmtN(a.weightG, a.weightG<10?3:1) : "нет навески";
      document.getElementById("planCost").placeholder = "авто: "+fmtN(a.startCost,0);
      const mp = econFarmMortPct(scope === "pool" ? [pool] : POOLS), fc = econFarmFCR();
      document.getElementById("planMort").placeholder = mp !== null ? "факт: "+fmtN(mp,3) : "нет данных — впишите";
      document.getElementById("planFcr").placeholder = fc !== null ? "факт: "+fmtN(fc,2) : "нет данных — впишите";
    };
    scopeEl.addEventListener("change", fillAuto); startEl.addEventListener("change", fillAuto); fillAuto();
    planForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const f = new FormData(planForm);
      const sv = f.get("scope");
      const scope = sv === "plot" ? "plot" : "pool", pool = sv === "plot" ? "" : sv.slice(5);
      const startDate = f.get("startDate");
      const a = econPlanAuto(scope, pool, startDate);
      const pick = (k, auto)=>{ const v = f.get(k); return v === "" || v === null ? auto : Number(v); };
      const count = pick("count", a.count), weightG = pick("weightG", a.weightG), startCost = pick("startCost", a.startCost);
      if(!(count > 0)){ toast("Укажите численность — на эту дату рыбы в учёте нет"); return; }
      if(!(weightG > 0)){ toast("Укажите навеску — замеров на эту дату нет"); return; }
      const mortPct = pick("mortPct", econFarmMortPct(scope === "pool" ? [pool] : POOLS));
      const fcr = pick("fcr", econFarmFCR());
      if(mortPct === null || !(mortPct >= 0)){ toast("Укажите отход, % в сутки — фактических данных по отходу нет"); return; }
      const temps = String(f.get("temps")||"").split(/[;\t]/).map(x=> parseNum(x));
      if(temps.length !== 12 || temps.some(t=> !Number.isFinite(t))){ toast("Нужно 12 значений температуры по месяцам через «;»"); return; }
      const needFcr = econActiveFeeds().some(fd=> econFeedRows(fd).some(r=> !(num(r.fcr) > 0)));
      if(needFcr && !(fcr > 0)){ toast("Укажите КК — у части кормов он не задан, а по навескам его пока не посчитать"); return; }
      const S = econSettings();
      const now = Date.now();
      const name = String(f.get("name")||"").trim() || `${scope==="pool"?poolLabelRaw(pool):"Участок"} с ${fmtDRaw(startDate)}`;
      const plan = { name, scope, pool, startDate, count, weightG, startCost: num(startCost),
        days: Math.min(Math.max(num(f.get("days"),365),1),1500), rateFactor: num(f.get("ratePct"),100)/100, mortPct: num(mortPct), fcr: fcr > 0 ? fcr : null,
        holdDays: num(f.get("holdDays")), fastingDays: econParseDays(f.get("fasting")), otherPerDay: num(f.get("otherPerDay")),
        temps, feeds: econSnapshotFeeds(), o2Price: S.o2Price, o2Coef: S.o2Coef, createdAt: now, updatedAt: now };
      const id = await Store.addDoc(pcol("plans"), plan);
      renderPlan._sel = id;
      toast("План рассчитан и сохранён");
    });
  }
  main.querySelectorAll("[data-plan-open]").forEach(b=> b.addEventListener("click", ()=>{ renderPlan._sel = b.dataset.planOpen; renderActive(); window.scrollTo({top:0, behavior:"smooth"}); }));
  main.querySelectorAll("[data-plan-refresh]").forEach(b=> b.addEventListener("click", async ()=>{
    const id = b.dataset.planRefresh, p = state.plans[id]; if(!p) return;
    if(!confirm("Пересчитать план по текущим нормам, ценам, температурам и настройкам? Старый вариант сохранится в архиве изменений.")) return;
    const S = econSettings();
    const MT = econMonthlyTemps();
    await Store.setDoc(pcol("plans"), id, {...p, feeds: econSnapshotFeeds(), temps: MT.any ? MT.temps : p.temps, o2Price: S.o2Price, o2Coef: S.o2Coef, updatedAt: Date.now()});
    await archiveSnapshot("plans", id, p, "edit");
    toast("План пересчитан");
  }));
  main.querySelectorAll("[data-plan-del]").forEach(b=> b.addEventListener("click", async ()=>{
    const id = b.dataset.planDel, p = state.plans[id]; if(!p) return;
    if(!confirm(`Удалить план «${p.name}»?`)) return;
    await Store.deleteDoc(pcol("plans"), id);
    await archiveSnapshot("plans", id, p, "delete");
    toast("План удалён");
  }));
  if(activeSection === "plan") drawPlanCharts();

  // --- себестоимость
  const costAtForm = document.getElementById("costAtForm");
  if(costAtForm) costAtForm.addEventListener("submit", e=>{ e.preventDefault(); renderCost._at = new FormData(costAtForm).get("at") || ""; renderActive(); });
  const costHistoryForm = document.getElementById("costHistoryForm");
  if(costHistoryForm) costHistoryForm.addEventListener("submit", e=>{
    e.preventDefault();
    const f = new FormData(costHistoryForm);
    const at = costAtForm.elements.at.value;
    if(f.get("from") > at){ toast("Начало истории должно быть не позже выбранной даты себестоимости"); return; }
    renderCost._historyFrom = f.get("from"); renderCost._historyPool = f.get("pool");
    renderActive();
    document.getElementById("costHistoryPanel").scrollIntoView({block:"start"});
  });
  const costPeriodForm = document.getElementById("costPeriodForm");
  if(costPeriodForm) costPeriodForm.addEventListener("submit", e=>{
    e.preventDefault();
    const f = new FormData(costPeriodForm);
    const from = f.get("from")||"", to = f.get("to")||"";
    if(from && to && from > to){ toast("«С даты» позже «По дату» — проверьте диапазон"); return; }
    renderCost._from = from; renderCost._to = to; renderActive();
  });
  const expenseForm = document.getElementById("expenseForm");
  if(expenseForm){
    expenseForm.addEventListener("input",updateExpensePreview);
    expenseForm.addEventListener("change",updateExpensePreview);
    updateExpensePreview();
  }
  if(expenseForm) expenseForm.addEventListener("submit", async e=>{
    e.preventDefault();
    const doc = expenseFromForm(expenseForm);
    if(!doc.date || !doc.category || !(doc.amount>0) || !Number.isFinite(doc.amount)){ toast("Укажите дату, статью и сумму больше нуля"); return; }
    if(expenseForm.elements.scope.value==="selected" && !doc.pools.length){ toast("Выберите хотя бы один бассейн"); return; }
    if(expenseForm.elements.scope.value==="cross" && !doc.targets.length){ toast("Выберите бассейны нужных участков"); return; }
    const allocation = econExpenseAllocation(doc);
    if(allocation.pending){ toast(allocation.pending); return; }
    if(allocation.unallocated || allocation.totalUnallocated){ toast("Нет рыбы для распределения — проверьте дату и бассейны"); return; }
    const btn = expenseForm.querySelector('button[type="submit"]');
    btn.disabled = true;
    try{
      await Store.addDoc(doc.targets ? "expenses" : pcol("expenses"), doc);
      expenseForm.reset();
      updateExpensePreview();
      toast("Затраты добавлены");
    }catch(err){ console.error("expense save failed",err); toast("Не удалось сохранить затраты. Проверьте соединение и повторите."); }
    finally{ btn.disabled = false; }
  });

  // --- кормление: живой пересчёт отклонений от нормы
  const feedForm = document.getElementById("feedForm");
  if(feedForm && feedForm.querySelector("[data-norm-row]")){
    feedForm.querySelectorAll("input[name^='u_'], input[name^='r_'], select[data-kind-pool]").forEach(el=>{
      el.addEventListener("input", updateFeedNormLive);
      el.addEventListener("change", updateFeedNormLive);
    });
    updateFeedNormLive();
  }
}

    (r.entries||[]).forEach(e=>{
      const vals = POOLS.map(p=>{
        const v = e.values && e.values[p];
        if(isNZ(v)) return NZ;
        return v!==undefined ? num(v) : "";
      });
      const nums = vals.filter(v=> v!=="" && v!==NZ );
      const mean = nums.length ? Number((nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2)) : "";
      aoa.push([fmtDRaw(r.date), e.time||"", ...vals, mean]);
    });
    const avg = tempDailyAvg(r);
    if(Object.keys(avg).length){
      const vals = POOLS.map(p=> avg[p]!==undefined ? Number(avg[p].toFixed(2)) : "");
      const nums = vals.filter(v=> v!=="" );
      aoa.push([fmtDRaw(r.date), "среднее за день", ...vals, nums.length? Number((nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2)) : ""]);
    }
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aoaSheet(aoa), "Температура");
  return { wb, filename:"Температура.xlsx" };
}

function buildWorkbook_treat(){
  const all = [];
  Object.values(state.treatments).forEach(doc=> (doc.events||[]).forEach(ev=> all.push({date:doc.date, ...ev})));
  all.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const aoa = [["Дата","Бассейн","Обработка"]];
  all.forEach(ev=> aoa.push([fmtDRaw(ev.date), poolLabelRaw(ev.pool), ev.text]));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aoaSheet(aoa), "Обработки");
  return { wb, filename:"Обработки.xlsx" };
}

function buildWorkbook_summary(){
  const { dates, byDate } = buildPopulation();
  const incByDate = incidentValuesByDate();
  const aoa = [["Дата","Остаток стада, шт.","Отход, шт. (журнал + ЧП)","Корм, кг","О2 средний, мг/л","Температура, °C"]];
  dates.forEach(date=>{
    const mort = dayMortTotal(date, incByDate);
    const feed = dayTotal(state.feed[date], "used");
    const o2avg = o2DailyAvg(state.o2[date]);
    const o2Vals = Object.values(o2avg);
    const o2Mean = o2Vals.length ? o2Vals.reduce((a,b)=>a+b,0)/o2Vals.length : "";
    const pop = byDate[date] ? POOLS.reduce((s,p)=>s+num(byDate[date][p]),0) : "";
    const tm = tempDayMean(state.temperature[date]);
    const temp = tm!==null ? Number(tm.toFixed(2)) : "";
    aoa.push([fmtDRaw(date), pop, mort, Number(feed.toFixed(2)), o2Mean!==""?Number(o2Mean.toFixed(2)):"", temp]);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aoaSheet(aoa), "Сводка");
  return { wb, filename:"Сводка.xlsx" };
}

function buildWorkbook_catalog(){
  const rows = Object.values(state.catalog).sort((a,b)=>num(a.from)-num(b.from));
  const aoa = [["От, г","До, г","Размер, мм","Категория","Вид корма"]];
  rows.forEach(r=> aoa.push([num(r.from), num(r.to), r.size||"", r.category||"", r.feedType||""]));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aoaSheet(aoa), "Справочник кормов");
  return { wb, filename:"Справочник кормов.xlsx" };
}

function buildWorkbook_archive(){
  const entries = Object.values(state.archive).sort((a,b)=> (a.archivedAt||0)-(b.archivedAt||0));
  const aoa = [["Когда изменено","Раздел","Дата записи","Действие","Предыдущее значение"]];
  entries.forEach(e=>{
    const when = e.archivedAt ? new Date(e.archivedAt) : null;
    const whenStr = when ? `${fmtDRaw(when.toISOString().slice(0,10))} ${when.toTimeString().slice(0,5)}` : "";
    aoa.push([whenStr, SECTION_NAMES[e.section]||e.section, fmtDRaw(e.date), e.action==="delete"?"удалено":"изменено", formatSnapshot(e.section, e.snapshot)]);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aoaSheet(aoa), "Архив изменений");
  return { wb, filename:"Архив изменений.xlsx" };
}

function buildWorkbook_all(){
  const parts = [buildWorkbook_stocking(), buildWorkbook_transfers(), buildWorkbook_mortality(), buildWorkbook_incidents(), buildWorkbook_feed(), buildWorkbook_naveski(), buildWorkbook_o2(), buildWorkbook_temp(), buildWorkbook_treat(), buildWorkbook_population(), buildWorkbook_summary(), buildWorkbook_catalog(), buildWorkbook_archive()];
  const wb = XLSX.utils.book_new();
  parts.forEach(p=> p.wb.SheetNames.forEach(name=> XLSX.utils.book_append_sheet(wb, p.wb.Sheets[name], name.slice(0,31))));
  return { wb, filename:"Ардон Аква — все разделы.xlsx" };
}

const WORKBOOK_BUILDERS = {
  stocking: buildWorkbook_stocking, transfers: buildWorkbook_transfers, mortality: buildWorkbook_mortality, incidents: buildWorkbook_incidents, feed: buildWorkbook_feed, naveski: buildWorkbook_naveski,
  o2: buildWorkbook_o2, temp: buildWorkbook_temp, treat: buildWorkbook_treat, population: buildWorkbook_population,
  summary: buildWorkbook_summary, catalog: buildWorkbook_catalog, archive: buildWorkbook_archive, all: buildWorkbook_all,
  plan: buildWorkbook_plan, cost: buildWorkbook_cost
};

function exportButton(key, label){
  return `<button class="btn ghost small" data-export="${key}">${label||"Выгрузить в Excel"}</button>`;
}

async function handleExport(key){
  if(typeof XLSX === "undefined"){ toast("Библиотека Excel не загрузилась, попробуйте ещё раз"); return; }
  const builder = WORKBOOK_BUILDERS[key];
  if(!builder) return;
  const { wb, filename } = builder();
  const arrayBuf = XLSX.write(wb, { bookType:"xlsx", type:"array" });
  try{
    const blob = new Blob([arrayBuf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    toast("Файл «"+filename+"» сохранён");
  }catch(err){
    console.warn("export failed", err); toast("Не удалось сохранить файл");
  }
}

async function boot(){
  try{
    if(window.firebase && typeof firebase.initializeApp === "function"){
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      auth = firebase.auth();
      // Вход запоминается между запусками браузера — выбрано осознанно:
      // компьютеры личные. Для общего компьютера здесь ставится SESSION.
      try{ auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
      catch(err){ console.warn("setPersistence failed", err); }
    }
  }catch(err){ console.warn("Firebase unavailable, falling back to local memory", err); db = null; auth = null; }
  dbAvailable = !!db;
  if(auth){
    // Вход/выход отслеживает сам Firebase: сессия восстанавливается
    // автоматически, отдельное хранение ключа в браузере не нужно.
    auth.onAuthStateChanged(user=>{
      if(user){
        currentUser = { username: user.email || user.uid, key: user.uid, email: user.email || "" };
        startUsersStore();
      } else {
        currentUser = null;
        state.users = {};
        usersLoaded = false;
      }
      renderActive();
    });
  }
  renderActive();
}
boot();
